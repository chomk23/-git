<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 교육 플랫폼 — 강의</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #ECEAE6; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .btn-primary {
      padding: 11px 24px; border-radius: 14px; background: #1A1A1A;
      color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer;
      transition: background 0.12s, transform 0.1s;
    }
    .btn-primary:hover { background: #333; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline {
      padding: 11px 24px; border-radius: 14px; background: white;
      color: #1A1A1A; font-size: 14px; font-weight: 500; border: 1.5px solid #E4E1DD;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-outline:hover { background: #F5F3F0; }
    .quiz-option {
      width: 100%; padding: 14px 18px; border-radius: 14px; text-align: left;
      border: 1.5px solid #E4E1DD; background: white; font-size: 14px; color: #374151;
      cursor: pointer; transition: all 0.12s;
    }
    .quiz-option:hover { border-color: #1A1A1A; background: #FAF9F7; }
    .quiz-option.selected { border-color: #1A1A1A; background: #1A1A1A; color: white; }
    .quiz-option.correct  { border-color: #16A34A; background: #F0FDF4; color: #15803D; }
    .quiz-option.wrong    { border-color: #DC2626; background: #FEF2F2; color: #DC2626; }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #E4E1DD; transition: background 0.2s;
    }
    .step-dot.active  { background: #1A1A1A; width: 24px; border-radius: 99px; }
    .step-dot.done    { background: #6B7280; }
    .progress-bar { height: 4px; background: #E4E1DD; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: #1A1A1A; transition: width 0.4s ease; }
    .tab-btn { padding: 8px 18px; border-radius: 99px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.12s; }
    .tab-btn.active { background: #1A1A1A; color: white; }
    .tab-btn:not(.active) { color: #6B7280; }
    .tab-btn:not(.active):hover { background: #F5F3F0; }
  </style>
</head>
<body class="min-h-screen">

<!-- 헤더 -->
<header class="sticky top-0 z-10 px-6 py-3 flex items-center gap-3" style="background:#ECEAE6;">
  <button onclick="history.back()"
    class="w-9 h-9 rounded-xl bg-white flex items-center justify-center shadow-sm hover:bg-gray-50 transition-colors">
    <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
  </button>
  <span class="text-sm text-gray-500">강의 목록으로</span>
  <div class="ml-auto flex items-center gap-2">
    <span class="text-xs" style="color:#B0ADA9;" id="header-progress-txt">진행률 0%</span>
    <div class="progress-bar w-32">
      <div class="progress-fill" id="header-progress-bar" style="width:0%"></div>
    </div>
  </div>
</header>

<div class="max-w-3xl mx-auto px-4 pb-16">

  <!-- 강의 타이틀 -->
  <div class="mb-6">
    <div class="flex items-center gap-2 mb-2">
      <span class="text-xs font-medium px-2.5 py-1 rounded-full" style="background:#F5F3F0; color:#8C8984;">필수 수강</span>
      <span class="text-xs" style="color:#B0ADA9;">15:00</span>
    </div>
    <h1 class="text-xl font-bold text-gray-900" id="course-title">피싱 메일 대응 전략</h1>
    <p class="text-sm mt-1" id="enroll-count" style="color:#8C8984;">수강 중</p>
  </div>

  <!-- 탭: 사전테스트 / 설문 -->
  <div class="flex gap-1 mb-6 bg-white rounded-2xl p-1.5 shadow-sm w-fit">
    <button class="tab-btn active" id="tab-pre"    onclick="showTab('pre')">사전 테스트</button>
    <button class="tab-btn"        id="tab-survey" onclick="showTab('survey')">설문</button>
  </div>

  <!-- ── 사전 테스트 ── -->
  <div id="section-pre">
    <div id="pre-quiz-card" class="bg-white rounded-3xl p-6 shadow-sm mb-4">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center" style="background:#F5F3F0;">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-900">사전 테스트</p>
          <p class="text-xs" style="color:#B0ADA9;">교육 전 현재 지식 수준을 확인합니다</p>
        </div>
        <span class="ml-auto text-xs px-2.5 py-1 rounded-full" style="background:#FEF9EE; color:#D97706;">5문항</span>
      </div>
      <div id="pre-quiz-container"></div>
      <div class="flex justify-between items-center mt-5" id="pre-nav-row">
        <div class="flex gap-1.5" id="pre-dots"></div>
        <button class="btn-primary" id="pre-next-btn" onclick="nextPreQuestion()" style="display:none;">다음</button>
      </div>
    </div>
    <div id="pre-result" class="hidden bg-white rounded-3xl p-6 shadow-sm text-center">
      <div class="w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center" style="background:#F5F3F0;">
        <span class="text-2xl font-bold" id="pre-score-display">3/5</span>
      </div>
      <p class="font-semibold text-gray-900">사전 테스트 완료</p>
      <p class="text-sm mt-1" style="color:#8C8984;">수고하셨습니다! 이제 설문에 응답해주세요.</p>
      <button class="btn-primary mt-5" onclick="showTab('survey')">설문 응답하기 →</button>
    </div>
  </div>

  <!-- ── 설문 ── -->
  <div id="section-survey" class="hidden">
    <div class="bg-white rounded-3xl p-6 shadow-sm mb-4">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center" style="background:#EFF6FF;">
          <svg class="w-5 h-5" style="color:#2563EB;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3v-3z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-900">행동 변화 설문</p>
          <p class="text-xs" style="color:#B0ADA9;">교육 후 인식 변화를 알려주세요</p>
        </div>
      </div>

      <div class="flex flex-col gap-5" id="survey-form">
        <!-- Q1 -->
        <div>
          <p class="text-sm font-medium text-gray-800 mb-3">1. 교육 전과 비교하여 피싱 메일을 인식하는 능력이 향상되었나요?</p>
          <div class="flex gap-2">
            <button class="quiz-option" onclick="selectSurvey(this, 'q1')">① 매우 그렇다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q1')">② 그렇다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q1')">③ 보통이다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q1')">④ 아니다</button>
          </div>
        </div>
        <!-- Q2 -->
        <div>
          <p class="text-sm font-medium text-gray-800 mb-3">2. 앞으로 의심스러운 메일을 받으면 어떻게 하시겠습니까?</p>
          <div class="flex flex-col gap-2">
            <button class="quiz-option" onclick="selectSurvey(this, 'q2')">① 즉시 보안팀에 신고하겠다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q2')">② 링크를 클릭하지 않고 삭제하겠다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q2')">③ 동료에게 먼저 확인하겠다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q2')">④ 잘 모르겠다</button>
          </div>
        </div>
        <!-- Q3 -->
        <div>
          <p class="text-sm font-medium text-gray-800 mb-3">3. 이번 교육이 업무에 실질적으로 도움이 되었나요?</p>
          <div class="flex gap-2">
            <button class="quiz-option" onclick="selectSurvey(this, 'q3')">① 매우 그렇다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q3')">② 그렇다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q3')">③ 보통이다</button>
            <button class="quiz-option" onclick="selectSurvey(this, 'q3')">④ 아니다</button>
          </div>
        </div>
      </div>

      <button class="btn-primary w-full mt-6" id="survey-submit-btn" onclick="submitSurvey()">설문 제출</button>
    </div>

    <!-- 제출 완료 -->
    <div id="survey-done" class="hidden bg-white rounded-3xl p-8 shadow-sm text-center">
      <div class="w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center" style="background:#F0FDF4;">
        <svg class="w-8 h-8" style="color:#16A34A;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <p class="text-lg font-bold text-gray-900 mb-1">교육 완료!</p>
      <p class="text-sm" style="color:#8C8984;">수고하셨습니다. 모든 과정을 완료했습니다.</p>
      <button class="btn-primary mt-6" onclick="location.href='index.html'">대시보드로 돌아가기</button>
    </div>
  </div>

</div>

<script>
  if (!sessionStorage.getItem('user')) location.href = 'login.html';

  // 실제 수강생 수 불러오기
  (async () => {
    const { count } = await sb.from('profiles').select('*', { count: 'exact', head: true }).neq('role', 'admin');
    if (count !== null) {
      document.getElementById('enroll-count').textContent = `${count.toLocaleString()}명이 수강 중`;
    }
  })();

  const preQuestions = [
    {
      q: '피싱(Phishing)의 주요 목적은 무엇인가요?',
      options: ['시스템 속도 향상', '개인정보 및 자격증명 탈취', '네트워크 최적화', '소프트웨어 업데이트'],
      answer: 1,
      explanation: '피싱은 공격자가 신뢰할 수 있는 기관을 사칭하여 사용자의 개인정보, 비밀번호, 금융 정보 등 자격증명을 탈취하는 사이버 공격 기법입니다.'
    },
    {
      q: '이메일 발신자 주소가 정상처럼 보이지만 실제로는 다른 경우, 이것을 무엇이라 하나요?',
      options: ['스팸(Spam)', '스푸핑(Spoofing)', '스니핑(Sniffing)', '스캐닝(Scanning)'],
      answer: 1,
      explanation: '스푸핑(Spoofing)은 발신자 정보를 위조하여 신뢰할 수 있는 주소처럼 보이게 하는 기법입니다. 이메일 헤더의 실제 발신 도메인을 확인하는 것이 중요합니다.'
    },
    {
      q: '피싱 메일의 특징으로 옳지 않은 것은?',
      options: ['긴급한 행동을 요구한다', '공식 기관을 사칭한다', '링크를 포함한다', '발신자 정보가 항상 정확하다'],
      answer: 3,
      explanation: '피싱 메일은 발신자 정보를 위조하는 경우가 많습니다. 발신자 이름이 신뢰할 수 있어 보여도 실제 이메일 주소를 확인해야 합니다.'
    },
    {
      q: '의심스러운 이메일을 받았을 때 가장 적절한 행동은?',
      options: ['링크를 클릭하여 확인한다', '첨부파일을 열어 내용을 확인한다', '보안팀에 신고한다', '다른 동료에게 전달한다'],
      answer: 2,
      explanation: '의심스러운 이메일은 링크 클릭이나 첨부파일 실행 없이 즉시 보안팀에 신고해야 합니다. 동료에게 전달하는 것도 피싱 확산을 유발할 수 있습니다.'
    },
    {
      q: '스피어 피싱(Spear Phishing)이란 무엇인가요?',
      options: ['불특정 다수를 대상으로 하는 공격', '특정 개인이나 조직을 타겟으로 하는 정교한 피싱', '이메일이 아닌 전화를 이용한 사기', '소셜미디어를 통한 공격'],
      answer: 1,
      explanation: '스피어 피싱은 특정 개인이나 조직의 정보를 미리 수집하여 맞춤형으로 제작된 고도화된 피싱 공격입니다. 일반 피싱보다 훨씬 정교하고 성공률이 높습니다.'
    },
  ];

  let preIdx = 0;
  let preScore = 0;
  let answered = false;

  function renderPreQuestion(idx) {
    answered = false;
    const q = preQuestions[idx];
    const nextBtn = document.getElementById('pre-next-btn');
    nextBtn.style.display = 'none';
    nextBtn.textContent = idx === preQuestions.length - 1 ? '결과 보기' : '다음';

    document.getElementById('pre-quiz-container').innerHTML = `
      <p class="text-xs font-medium mb-3" style="color:#B0ADA9;">문항 ${idx+1} / ${preQuestions.length}</p>
      <p class="text-sm font-semibold text-gray-900 mb-4 leading-relaxed">${q.q}</p>
      <div class="flex flex-col gap-2" id="pre-options">
        ${q.options.map((o, i) => `
          <button class="quiz-option" onclick="selectPreOption(this, ${i})">${i+1}. ${o}</button>
        `).join('')}
      </div>
      <div id="pre-explanation" class="hidden mt-4 rounded-2xl px-4 py-3 text-sm leading-relaxed" style="background:#F5F3F0; color:#4B5563;"></div>`;

    renderDots(preQuestions.length, idx, 'pre-dots');
  }

  function selectPreOption(btn, picked) {
    if (answered) return;
    answered = true;

    const q = preQuestions[preIdx];
    const options = document.getElementById('pre-options').querySelectorAll('.quiz-option');

    options.forEach(b => { b.disabled = true; });
    options[q.answer].classList.add('correct');

    if (picked === q.answer) {
      preScore++;
    } else {
      btn.classList.add('wrong');
    }

    // 해설 표시
    const expEl = document.getElementById('pre-explanation');
    const icon = picked === q.answer ? '✅' : '❌';
    const label = picked === q.answer ? '정답입니다!' : '오답입니다.';
    expEl.innerHTML = `<p class="font-semibold mb-1" style="color:${picked===q.answer?'#16A34A':'#DC2626'};">${icon} ${label}</p><p>${q.explanation}</p>`;
    expEl.classList.remove('hidden');

    // 다음 버튼 표시
    document.getElementById('pre-next-btn').style.display = 'block';
  }

  function nextPreQuestion() {
    if (preIdx < preQuestions.length - 1) {
      preIdx++;
      renderPreQuestion(preIdx);
    } else {
      document.getElementById('pre-quiz-card').classList.add('hidden');
      document.getElementById('pre-result').classList.remove('hidden');
      document.getElementById('pre-score-display').textContent = `${preScore}/${preQuestions.length}`;
      sessionStorage.setItem('preScore', preScore);
      updateProgress(50);
    }
  }

  function renderDots(total, current, id) {
    document.getElementById(id).innerHTML = Array.from({length: total}, (_, i) =>
      `<div class="step-dot ${i < current ? 'done' : i === current ? 'active' : ''}"></div>`
    ).join('');
  }

  function selectSurvey(btn, group) {
    btn.parentElement.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function submitSurvey() {
    document.getElementById('survey-form').classList.add('hidden');
    document.getElementById('survey-submit-btn').classList.add('hidden');
    document.getElementById('survey-done').classList.remove('hidden');
    updateProgress(100);
  }

  function showTab(tab) {
    ['pre', 'survey'].forEach(t => {
      document.getElementById(`section-${t}`).classList.add('hidden');
      document.getElementById(`tab-${t}`).classList.remove('active');
    });
    document.getElementById(`section-${tab}`).classList.remove('hidden');
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

  function updateProgress(pct) {
    document.getElementById('header-progress-bar').style.width = pct + '%';
    document.getElementById('header-progress-txt').textContent = `진행률 ${pct}%`;
  }

  renderPreQuestion(0);
</script>
</body>
</html>
