<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 레이싱 — 보안 교육 플랫폼</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #ECEAE6; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

    /* ── 카메라 따라가는 스크롤 트랙 ── */
    .race-viewport {
      position: relative; height: 260px; border-radius: 24px; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, #1E1B4B 0%, #0F172A 60%);
      box-shadow: inset 0 -40px 80px rgba(0,0,0,0.5);
    }
    /* 스카이라인의 별 (장식) */
    .race-viewport::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background-image:
        radial-gradient(1px 1px at 20% 12%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 78% 8%,  rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 45% 18%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 62% 22%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 8% 28%,  rgba(255,255,255,0.4), transparent);
    }
    .race-world {
      position: absolute; left: 0; top: 0; height: 100%;
      will-change: transform;
      transition: transform 0.18s linear;
    }
    .race-world.no-tx { transition: none; }

    /* 도로 영역 */
    .road {
      position: absolute; left: 0; right: 0; top: 50px; bottom: 0;
      background: #1F2937;
      box-shadow: 0 -2px 0 #FBBF24, inset 0 2px 0 #374151;
    }
    /* 가속 시 도로 위에 흐르는 모션 라인 */
    .road::after {
      content:''; position:absolute; inset:0; opacity:0;
      background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.25) 0 40px, transparent 40px 80px);
      animation: streak 0.4s linear infinite;
      transition: opacity 0.2s;
    }
    .race-viewport.boosting .road::after { opacity: 1; }
    @keyframes streak {
      from { transform: translateX(0); }
      to   { transform: translateX(-80px); }
    }

    .lane {
      position: absolute; left: 0; height: 56px;
      display: flex; align-items: center;
    }
    .lane-1 { top: 60px; }
    .lane-2 { top: 122px; }
    .lane-3 { top: 184px; }
    /* 차선 사이 노란 점선 */
    .divider {
      position: absolute; left: 0; height: 3px;
      background-image: repeating-linear-gradient(to right, #FBBF24 0 32px, transparent 32px 64px);
    }
    .div-1 { top: 116px; }
    .div-2 { top: 178px; }

    /* 거리 마커 */
    .marker {
      position: absolute; top: 50px; bottom: 0; width: 3px;
      background: linear-gradient(to bottom, transparent, #38BDF8 40%, #38BDF8 60%, transparent);
      opacity: 0.7;
    }
    .marker-label {
      position: absolute; top: 50px; transform: translateX(-50%);
      font-size: 10px; font-weight: 700; color: #38BDF8;
      background: rgba(15, 23, 42, 0.8);
      padding: 2px 6px; border-radius: 4px;
      letter-spacing: 0.5px;
    }

    /* 결승선 */
    .finish-flag {
      position: absolute; top: 50px; bottom: 0; width: 18px;
      background: repeating-linear-gradient(45deg, #fff 0 10px, #1F2937 10px 20px);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }
    .finish-text {
      position: absolute; top: 16px; transform: translateX(-50%);
      font-size: 14px; font-weight: 800; color: #FBBF24;
      letter-spacing: 2px;
    }

    /* 자동차 */
    .car {
      position: absolute; left: 0; top: 50%;
      margin-top: -16px;
      transition: left 0.12s linear;
      z-index: 5;
    }
    .car.player { margin-top: -17px; z-index: 10; }
    .car svg { display: block; }
    .car-label {
      position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
      font-size: 9px; color: rgba(255,255,255,0.7); font-weight: 700; letter-spacing: 1px;
      white-space: nowrap;
    }
    .car.player .car-label { color: #FCD34D; }

    /* 부스트 효과 */
    .speed-burst { animation: burst 0.6s ease; }
    @keyframes burst {
      0%, 100% { filter: brightness(1); }
      40%      { filter: brightness(1.6) drop-shadow(0 0 14px #FBBF24); }
    }
    .car.player.boosting::after {
      content:''; position:absolute; right:100%; top:50%; transform:translateY(-50%);
      width: 60px; height: 6px;
      background: linear-gradient(to left, #FBBF24, transparent);
      border-radius: 4px; margin-right: 2px;
      animation: trail-pulse 0.3s ease-in-out infinite alternate;
    }
    @keyframes trail-pulse {
      from { opacity: 0.6; transform: translateY(-50%) scaleX(1); }
      to   { opacity: 1;   transform: translateY(-50%) scaleX(1.4); }
    }
    .shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-4px); }
      75%      { transform: translateX(4px); }
    }

    /* ── 미니맵 (트랙 전체 조감) ── */
    .minimap {
      position: relative;
      height: 28px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(to right, #1F2937 0%, #1F2937 100%);
      border: 1.5px solid #374151;
    }
    .mini-track-line {
      position: absolute; left: 8px; right: 24px; top: 50%; height: 2px;
      transform: translateY(-50%);
      background-image: repeating-linear-gradient(to right, #4B5563 0 6px, transparent 6px 12px);
    }
    .mini-finish {
      position: absolute; right: 8px; top: 4px; bottom: 4px; width: 8px;
      background: repeating-linear-gradient(to bottom, #fff 0 3px, #1F2937 3px 6px);
      border-radius: 2px;
    }
    .mini-dot {
      position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: left 0.18s linear;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
    .mini-dot.player { background: #FBBF24; border: 1.5px solid #fff; width: 12px; height: 12px; z-index: 3; }
    .mini-dot.ai1    { background: #9CA3AF; z-index: 2; }
    .mini-dot.ai2    { background: #EF4444; z-index: 1; }
    .mini-legend {
      position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
      font-size: 9px; color: #9CA3AF; letter-spacing: 0.5px;
    }

    .question-card { background:white; border-radius:24px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
    .answer-btn { padding:14px 18px; border-radius:14px; text-align:left; border:1.5px solid #E4E1DD; background:white; cursor:pointer; transition:all 0.12s; width:100%; font-size:14px; color:#374151; }
    .answer-btn:hover:not(:disabled) { border-color:#1A1A1A; background:#FAF9F7; }
    .answer-btn.correct { border-color:#16A34A; background:#F0FDF4; color:#15803D; font-weight:600; }
    .answer-btn.wrong   { border-color:#DC2626; background:#FEF2F2; color:#DC2626; font-weight:600; }
    .answer-btn:disabled { cursor:default; }

    .btn-primary {
      padding: 12px 28px; border-radius: 14px;
      background: #1A1A1A; color: #fff; font-size: 14px; font-weight: 600;
      border: none; cursor: pointer; transition: background 0.12s;
    }
    .btn-primary:hover { background: #333; }
    .btn-outline {
      padding: 12px 28px; border-radius: 14px; background: white;
      color: #1A1A1A; font-size: 14px; font-weight: 600; border: 1.5px solid #E4E1DD;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-outline:hover { background: #F5F3F0; }
  </style>
</head>
<body class="min-h-screen p-4">

<div class="max-w-3xl mx-auto">

    <div class="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center" style="background:linear-gradient(135deg,#DC2626,#F59E0B);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 17h2l1.5-4h7L17 17h2"/>
        <path d="M7 17v2a1 1 0 001 1h1a1 1 0 001-1v-2"/>
        <path d="M14 17v2a1 1 0 001 1h1a1 1 0 001-1v-2"/>

    <div id="replay-notice" class="hidden mt-5 p-3 rounded-2xl" style="background:#FFFBEB; color:#92400E; font-size:13px; font-weight:500; border:1px solid #FDE68A;">
      이미 한 번 플레이한 교육입니다.<br>이번 점수는 기록되지 않으니 연습용으로 활용하세요.

  <!-- ── 게임 화면 ── -->

        <p class="text-xs" style="color:#B0ADA9;">진행도</p>
        <p id="progress-pct" class="text-xl font-bold text-gray-900 mt-0.5">0%</p>
      </div>
      <div class="bg-white rounded-2xl px-4 py-3 shadow-sm">
        <p class="text-xs" style="color:#B0ADA9;">정답</p>
        <p id="correct-count" class="text-xl font-bold text-gray-900 mt-0.5">0</p>
      </div>
    </div>

    <!-- 미니맵 (트랙 전체 조감) -->
    <div class="minimap mb-3">
      <div class="mini-track-line"></div>
      <div class="mini-legend">FINISH</div>
      <div id="mini-ai1"    class="mini-dot ai1"    style="left:8px;"></div>
      <div id="mini-ai2"    class="mini-dot ai2"    style="left:8px;"></div>
      <div id="mini-player" class="mini-dot player" style="left:8px;"></div>
      <div class="mini-finish"></div>

    <!-- 카메라 따라가는 스크롤 트랙 -->
    <div id="viewport" class="race-viewport mb-4">
      <!-- 월드 (viewport보다 훨씬 넓음, 카메라가 따라감) -->
      <div id="world" class="race-world">
        <!-- 도로 -->
        <div class="road"></div>
        <!-- 차선 사이 노란 점선 -->
        <div id="div-1" class="divider div-1"></div>
        <div id="div-2" class="divider div-2"></div>
        <!-- 거리 마커 (25%, 50%, 75%) -->
        <div id="markers"></div>
        <!-- 결승선 -->
        <div id="finish-flag" class="finish-flag"></div>
        <div id="finish-text" class="finish-text">FINISH</div>

        <!-- 차들 (각 lane 안에) -->
        <div class="lane lane-1" id="lane-1">
          <div id="ai1" class="car">
            <div class="car-label">AI 1</div>
            <svg width="48" height="34" viewBox="0 0 48 34" fill="none">
              <rect x="4" y="14" width="40" height="12" rx="3" fill="#9CA3AF"/>
              <rect x="11" y="7" width="22" height="10" rx="2" fill="#6B7280"/>
              <rect x="13" y="9" width="7" height="6" rx="1" fill="#E5E7EB"/>
              <rect x="24" y="9" width="7" height="6" rx="1" fill="#E5E7EB"/>
              <circle cx="13" cy="28" r="5" fill="#0F172A"/>
              <circle cx="35" cy="28" r="5" fill="#0F172A"/>
              <circle cx="13" cy="28" r="2" fill="#9CA3AF"/>
              <circle cx="35" cy="28" r="2" fill="#9CA3AF"/>
            </svg>
          </div>
        </div>
        <div class="lane lane-2" id="lane-2">
          <div id="player" class="car player">

              <rect x="4" y="15" width="44" height="13" rx="3" fill="#FBBF24"/>
              <rect x="12" y="7" width="24" height="11" rx="2" fill="#F59E0B"/>
              <rect x="14" y="9" width="8" height="7" rx="1" fill="#FEF3C7"/>
              <rect x="26" y="9" width="8" height="7" rx="1" fill="#FEF3C7"/>
              <circle cx="14" cy="30" r="5.5" fill="#0F172A"/>
              <circle cx="38" cy="30" r="5.5" fill="#0F172A"/>
              <circle cx="14" cy="30" r="2.2" fill="#FBBF24"/>
              <circle cx="38" cy="30" r="2.2" fill="#FBBF24"/>
            </svg>
          </div>
        </div>
        <div class="lane lane-3" id="lane-3">
          <div id="ai2" class="car">
            <div class="car-label">AI 2</div>
            <svg width="48" height="34" viewBox="0 0 48 34" fill="none">

              <rect x="11" y="7" width="22" height="10" rx="2" fill="#DC2626"/>
              <rect x="13" y="9" width="7" height="6" rx="1" fill="#FEE2E2"/>
              <rect x="24" y="9" width="7" height="6" rx="1" fill="#FEE2E2"/>

              <circle cx="35" cy="28" r="5" fill="#0F172A"/>

    </div>

    <!-- 문제 -->

  <!-- ── 결과 화면 ── -->

      <button onclick="location.reload()" class="btn-primary flex-1">다시 도전</button>

</div>

<script>
if (!sessionStorage.getItem('user')) location.href = 'login.html';

// ── 문제 풀 (16문항) ──
const QUESTIONS = [
  { q:'강력한 비밀번호의 조건으로 가장 적절한 것은?',
    options:['짧고 외우기 쉬운 단어', '8자 이상 + 대소문자 + 숫자 + 특수문자', '생년월일이나 전화번호', '동일한 문자 반복'],
    answer:1 },
  { q:'피싱 메일을 식별하는 가장 좋은 방법은?',
    options:['이메일 디자인을 본다', '발신자 주소와 링크 도메인을 확인한다', '제목만 본다', '첨부파일을 열어본다'],
    answer:1 },
  { q:'공공 와이파이에서 가장 안전한 행동은?',
    options:['은행 업무 처리', 'VPN 사용 또는 모바일 데이터 활용', '비밀번호 변경 작업', '쇼핑 결제 진행'],
    answer:1 },
  { q:'2단계 인증(2FA)을 사용하는 주된 이유는?',
    options:['로그인 속도를 빠르게 하기 위해', '비밀번호가 유출되어도 계정을 보호하기 위해', '비밀번호를 잊지 않기 위해', '이메일을 줄이기 위해'],
    answer:1 },
  { q:'모르는 사람이 보낸 이메일 첨부파일은?',
    options:['바로 열어본다', '발신자를 확인하고 의심되면 삭제한다', '친구에게 전달해 의견을 묻는다', '바이러스 검사 없이 다운로드한다'],
    answer:1 },
  { q:'소프트웨어 업데이트가 중요한 이유는?',
    options:['새 기능을 위해서만 필요하다', '보안 취약점이 패치되어 공격을 막아준다', '용량을 늘리기 위해서다', '디자인 개선 때문이다'],
    answer:1 },
  { q:'사회공학적 공격의 대표적 예시는?',
    options:['방화벽 우회 해킹', '직원을 속여 기밀 정보를 얻어내는 행위', '서버 직접 침입', 'DDoS 공격'],
    answer:1 },
  { q:'랜섬웨어에 감염되었을 때 가장 먼저 해야 할 일은?',
    options:['요구한 금액을 즉시 지불한다', '네트워크에서 분리하고 보안팀에 신고한다', '컴퓨터를 포맷한다', '아무것도 하지 않는다'],
    answer:1 },

// ── 게임 상수 ──
const RACE_TIME      = 60;     // 초
const WORLD_WIDTH    = 3200;   // 트랙 전체 길이(px). viewport보다 훨씬 넓어서 카메라가 스크롤
const FINISH_X       = WORLD_WIDTH - 80;  // 결승선 위치(px) — 오른쪽 여유 두기

// 속도: %/sec (논리적 진행도 단위)
const PLAYER_BASE    = 1.0;    // 무답일 때 60초에 60% 정도 진행
const PLAYER_BOOST   = 2.5;    // 부스트 중 속도 (정답 직후 1.8초)
const AI1_SPEED      = 1.5;    // 빠른 AI — 60초에 90% (정답 없으면 짐)
const AI2_SPEED      = 0.85;   // 느린 AI — 60초에 ~51%
const BOOST_DURATION = 1800;
const SLOW_DURATION  = 1000;
const CORRECT_JUMP   = 5;      // 정답 시 즉시 +5%

let playerPos = 0, ai1Pos = 0, ai2Pos = 0;
let playerBoostUntil = 0, playerSlowUntil = 0;
let raceRunning = false;
let raceStart = 0, lastFrame = 0;
let correctCount = 0, totalAnswered = 0;
let questionPool = [];
let currentQIdx = 0;
let currentShuffled = null;
let cameraX = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 페이지 로드 시 재도전 안내 체크
(async function init() {
  try {
    const u = JSON.parse(sessionStorage.getItem('user') || '{}');
    if (!u.email) return;
    const { data } = await sb.from('game_scores')
      .select('id').eq('user_email', u.email).eq('game_type', 'security_race').limit(1);
    if (data && data.length > 0) {
      document.getElementById('replay-notice').classList.remove('hidden');
    }
  } catch (e) {}
})();

// 거리 마커와 결승선 표시 위치 세팅 (월드 좌표 기준)
function setupWorld() {
  const world = document.getElementById('world');
  world.style.width = WORLD_WIDTH + 'px';

  // 차선 사이 점선
  document.getElementById('div-1').style.width = WORLD_WIDTH + 'px';
  document.getElementById('div-2').style.width = WORLD_WIDTH + 'px';

  // 거리 마커 (25%, 50%, 75%)
  const markers = document.getElementById('markers');
  markers.innerHTML = '';
  [25, 50, 75].forEach(p => {
    const x = (p / 100) * FINISH_X;
    const line = document.createElement('div');
    line.className = 'marker';
    line.style.left = x + 'px';
    markers.appendChild(line);
    const label = document.createElement('div');
    label.className = 'marker-label';
    label.style.left = x + 'px';
    label.textContent = p + '%';
    markers.appendChild(label);
  });

  // 결승선
  document.getElementById('finish-flag').style.left = FINISH_X + 'px';
  document.getElementById('finish-text').style.left = (FINISH_X + 9) + 'px';

  // 카메라 즉시 리셋 (transition 끄고)
  world.classList.add('no-tx');
  world.style.transform = 'translateX(0px)';
  requestAnimationFrame(() => world.classList.remove('no-tx'));
}

function startRace() {
  playerPos = ai1Pos = ai2Pos = 0;
  cameraX = 0;
  correctCount = 0;
  totalAnswered = 0;
  currentQIdx = 0;
  playerBoostUntil = 0;
  playerSlowUntil = 0;
  questionPool = shuffle(QUESTIONS);

  document.getElementById('intro').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');

  setupWorld();
  // 카들 초기 위치
  updateCarPos('player', 0);
  updateCarPos('ai1', 0);
  updateCarPos('ai2', 0);
  updateMinimap();

  showQuestion();

  raceStart = performance.now();
  lastFrame = performance.now();
  raceRunning = true;
  requestAnimationFrame(loop);
}

function loop(now) {
  if (!raceRunning) return;
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  const elapsed = (now - raceStart) / 1000;
  const remaining = Math.max(0, RACE_TIME - elapsed);

  // 플레이어 속도
  let playerSpeed = PLAYER_BASE;
  const boosting = now < playerBoostUntil;
  if (boosting)               playerSpeed = PLAYER_BOOST;
  if (now < playerSlowUntil)  playerSpeed = 0;
  playerPos = Math.min(100, playerPos + playerSpeed * dt);

  ai1Pos = Math.min(100, ai1Pos + AI1_SPEED * dt);
  ai2Pos = Math.min(100, ai2Pos + AI2_SPEED * dt);

  updateCarPos('player', playerPos);
  updateCarPos('ai1', ai1Pos);
  updateCarPos('ai2', ai2Pos);
  updateCamera();
  updateMinimap();

  // 부스트 UI 효과
  const viewport = document.getElementById('viewport');
  const playerEl = document.getElementById('player');
  if (boosting) {
    viewport.classList.add('boosting');
    playerEl.classList.add('boosting');
  } else {
    viewport.classList.remove('boosting');
    playerEl.classList.remove('boosting');
  }

  document.getElementById('time-left').textContent     = remaining.toFixed(1) + '초';
  document.getElementById('progress-pct').textContent  = Math.round(playerPos) + '%';
  document.getElementById('correct-count').textContent = correctCount;

  if (playerPos >= 100 || remaining <= 0) {
    endRace();
    return;
  }
  requestAnimationFrame(loop);
}

// 차의 월드 좌표상 위치를 설정 (lane 안 left 속성)
function updateCarPos(id, pct) {
  const el = document.getElementById(id);
  if (!el) return;
  const worldX = (pct / 100) * FINISH_X;
  el.style.left = worldX + 'px';
}

// 카메라가 플레이어를 화면 35% 지점에 두고 따라감
function updateCamera() {
  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const vw = viewport.offsetWidth;
  const playerWorldX = (playerPos / 100) * FINISH_X;
  let target = playerWorldX - vw * 0.35;
  target = Math.max(0, Math.min(WORLD_WIDTH - vw, target));
  cameraX = target;
  world.style.transform = `translateX(${-cameraX}px)`;
}

function updateMinimap() {
  // 미니맵: 트랙 전체를 좌→우로, 8px ~ (width-24px) 사이에 매핑
  const mini = document.querySelector('.minimap');
  if (!mini) return;
  const total = mini.offsetWidth - 32;
  const startX = 8;
  ['player', 'ai1', 'ai2'].forEach(name => {
    const dot = document.getElementById('mini-' + name);
    if (!dot) return;
    const pos = name === 'player' ? playerPos : (name === 'ai1' ? ai1Pos : ai2Pos);
    dot.style.left = (startX + (pos / 100) * total) + 'px';
  });
}

function showQuestion() {
  const q = questionPool[currentQIdx % questionPool.length];
  // 답안 순서를 랜덤화 (정답 위치 추적)
  const tagged = q.options.map((opt, i) => ({ opt, isCorrect: i === q.answer }));
  const shuffledOpts = shuffle(tagged);
  const correctIdx = shuffledOpts.findIndex(o => o.isCorrect);
  currentShuffled = { shuffledOpts, correctIdx };

  document.getElementById('q-text').textContent = `Q${totalAnswered + 1}. ${q.q}`;
  const opts = document.getElementById('q-options');
  opts.innerHTML = shuffledOpts.map((o, i) =>
    `<button class="answer-btn" onclick="answer(${i})">${o.opt}</button>`
  ).join('');
}

function answer(idx) {
  if (!currentShuffled) return;
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(b => b.disabled = true);

  const correct = (idx === currentShuffled.correctIdx);
  if (correct) {
    buttons[idx].classList.add('correct');
    correctCount++;
    playerPos = Math.min(100, playerPos + CORRECT_JUMP);
    playerBoostUntil = performance.now() + BOOST_DURATION;
    const player = document.getElementById('player');
    player.classList.add('speed-burst');
    setTimeout(() => player.classList.remove('speed-burst'), 600);
  } else {
    buttons[idx].classList.add('wrong');
    buttons[currentShuffled.correctIdx].classList.add('correct');
    playerSlowUntil = performance.now() + SLOW_DURATION;
    const player = document.getElementById('player');
    player.classList.add('shake');
    setTimeout(() => player.classList.remove('shake'), 400);
  }
  totalAnswered++;

  // 다음 문제 (0.9초 후)
  setTimeout(() => {
    if (!raceRunning) return;
    currentQIdx++;
    showQuestion();
  }, 900);
}

function endRace() {
  raceRunning = false;
  const elapsed = Math.min(RACE_TIME, (performance.now() - raceStart) / 1000);
  const finished = playerPos >= 100;

  // 순위
  const positions = [
    { name: 'YOU', pos: playerPos },
    { name: 'AI 1', pos: ai1Pos },
    { name: 'AI 2', pos: ai2Pos },
  ].sort((a, b) => b.pos - a.pos);
  const myRank = positions.findIndex(p => p.name === 'YOU') + 1;

  // 점수: 결승선 통과 시 70 + 남은 시간 보너스(최대 30), 미완주 시 진행도 × 0.7
  let finalScore, title;
  if (finished) {
    const timeBonus = Math.round((RACE_TIME - elapsed) / RACE_TIME * 30);
    finalScore = Math.min(100, 70 + timeBonus);
    title = myRank === 1 ? '1등! 모든 차를 제쳤습니다.'
          : myRank === 2 ? '2등 — 결승선 통과 성공!'
          : '결승선 통과! 시간 내 완주했습니다.';
  } else {
    finalScore = Math.round(playerPos * 0.7);
    title = '시간 초과 — 다음엔 더 빠르게 답해보세요.';
  }

  // 결과 아이콘
  const iconWrap = document.getElementById('result-icon-wrap');
  if (myRank === 1 && finished) {
    iconWrap.style.background = 'linear-gradient(135deg,#F59E0B,#FBBF24)';
  } else if (finished) {
    iconWrap.style.background = 'linear-gradient(135deg,#10B981,#34D399)';
  } else {
    iconWrap.style.background = 'linear-gradient(135deg,#6B7280,#9CA3AF)';
  }

  document.getElementById('game').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result-title').textContent = title;
  document.getElementById('final-score').textContent = finalScore;
  document.getElementById('final-progress').textContent = Math.round(playerPos) + '%';
  document.getElementById('final-correct').textContent = `${correctCount}/${totalAnswered}`;
  document.getElementById('rank-info').textContent =
    `최종 순위: ${myRank}등 · ${positions.map(p => `${p.name} ${Math.round(p.pos)}%`).join(' / ')}`;

  saveScore(finalScore);
}

async function saveScore(score) {
  try {
    const u = JSON.parse(sessionStorage.getItem('user') || '{}');
    if (!u.email) return;
    const { data: existing } = await sb.from('game_scores')
      .select('id').eq('user_email', u.email).eq('game_type', 'security_race').limit(1);
    if (existing && existing.length > 0) return;  // 재도전 — 저장 안 함
    await sb.from('game_scores').insert({
      user_email: u.email,
      game_type:  'security_race',
      score:      score,
    });
  } catch (e) {}
}
