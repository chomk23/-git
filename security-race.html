<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SECURITY RACE — 보안 교육 플랫폼</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-pink:   #ff2d95;
      --neon-cyan:   #00f0ff;
      --neon-yellow: #fff200;
      --neon-purple: #b026ff;
      --neon-orange: #ff6b00;
      --neon-green:  #39ff14;
      --bg-deep:     #0a0118;
      --bg-mid:      #1e0b3c;
      --bg-band:     #2a0e58;
      --text-cream:  #ffe8d0;
    }

    * { box-sizing: border-box; }
    /* Pixel font as default — Korean text gets .ko class for legibility */
    body {
      font-family: 'Press Start 2P', monospace;
    }
    .ko, .ko * {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 16px 40px;
      color: var(--text-cream);
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(176, 38, 255, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(255, 45, 149, 0.25) 0%, transparent 60%);
      overflow-x: hidden;
      image-rendering: pixelated;
    }

    /* Twinkling stars background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 7%  12%, white, transparent),
        radial-gradient(1px 1px at 21% 28%, white, transparent),
        radial-gradient(1px 1px at 35% 16%, white, transparent),
        radial-gradient(1px 1px at 48% 22%, white, transparent),
        radial-gradient(1px 1px at 62% 8%,  white, transparent),
        radial-gradient(1px 1px at 79% 18%, white, transparent),
        radial-gradient(1px 1px at 91% 31%, white, transparent),
        radial-gradient(2px 2px at 14% 42%, white, transparent),
        radial-gradient(1px 1px at 88% 47%, white, transparent),
        radial-gradient(1px 1px at 4%  60%, white, transparent),
        radial-gradient(1px 1px at 96% 70%, white, transparent),
        radial-gradient(2px 2px at 30% 75%, white, transparent);
      opacity: 0.7;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.45; }
      to   { opacity: 0.85; }
    }

    /* Global CRT scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      z-index: 100;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Pixel frame (chunky neon border) */
    .pixel-frame {
      border: 4px solid var(--neon-cyan);
      background: var(--bg-mid);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-cyan),
        0 0 30px rgba(0, 240, 255, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    /* Header */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      margin-bottom: 22px;
    }
    .arcade-title {
      font-size: 11px;
      color: var(--neon-pink);
      text-shadow:
        0 0 4px var(--neon-pink),
        0 0 14px var(--neon-pink),
        2px 2px 0 var(--neon-purple);
      letter-spacing: 3px;
    }
    .back-link {
      font-size: 8px;
      color: var(--neon-cyan);
      text-decoration: none;
      letter-spacing: 1.5px;
      padding: 6px 10px;
      border: 2px solid var(--neon-cyan);
      transition: all 0.1s;
    }
    .back-link:hover {
      background: var(--neon-cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    /* ── INTRO CARD ───────────────────────────────────────── */
    .intro-card { padding: 36px 28px; text-align: center; }
    .intro-title {
      font-size: 20px;
      color: var(--neon-yellow);
      text-shadow:
        0 0 8px var(--neon-yellow),
        3px 3px 0 var(--neon-pink),
        4px 4px 0 var(--neon-purple);
      margin: 18px 0 16px;
      letter-spacing: 3px;
      line-height: 1.5;
    }
    .intro-sub {
      font-size: 13px;
      color: var(--text-cream);
      line-height: 1.9;
      margin-bottom: 22px;
    }
    .info-chips {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 22px 0;
    }
    .info-chip {
      padding: 14px 6px;
      border: 3px solid;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .info-chip .chip-label {
      font-size: 7px;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      opacity: 0.75;
    }
    .info-chip .chip-value {
      font-size: 10px;
      letter-spacing: 1px;
    }
    .chip-correct { border-color: var(--neon-green);  box-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
    .chip-correct .chip-value { color: var(--neon-green); text-shadow: 0 0 6px var(--neon-green); }
    .chip-wrong   { border-color: var(--neon-pink);   box-shadow: 0 0 10px rgba(255, 45, 149, 0.3); }
    .chip-wrong .chip-value { color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); }
    .chip-time    { border-color: var(--neon-cyan);   box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
    .chip-time .chip-value { color: var(--neon-cyan); text-shadow: 0 0 6px var(--neon-cyan); }

    .replay-notice {
      margin: 20px 0;
      padding: 14px;
      border: 3px solid var(--neon-yellow);
      background: rgba(255, 242, 0, 0.08);
      color: var(--neon-yellow);
      font-size: 8px;
      line-height: 1.8;
      letter-spacing: 1px;
      animation: warn-blink 1.2s ease-in-out infinite alternate;
    }
    @keyframes warn-blink {
      from { box-shadow: 0 0 8px rgba(255, 242, 0, 0.2); }
      to   { box-shadow: 0 0 20px rgba(255, 242, 0, 0.6); }
    }

    /* Big arcade button */
    .arcade-btn {
      display: inline-block;
      padding: 18px 36px;
      background: var(--neon-pink);
      color: var(--bg-deep);
      border: none;
      font-size: 12px;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-pink),
        0 8px 0 var(--neon-purple),
        0 0 24px rgba(255, 45, 149, 0.5);
      transition: transform 0.08s, box-shadow 0.08s;
      animation: btn-pulse 1.4s ease-in-out infinite alternate;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .arcade-btn:hover { transform: translateY(-2px); }
    .arcade-btn:active {
      transform: translateY(6px);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-pink),
        0 2px 0 var(--neon-purple),
        0 0 24px rgba(255, 45, 149, 0.5);
    }
    @keyframes btn-pulse {
      from {
        box-shadow:
          0 0 0 4px var(--bg-deep),
          0 0 0 8px var(--neon-pink),
          0 8px 0 var(--neon-purple),
          0 0 20px rgba(255, 45, 149, 0.4);
      }
      to {
        box-shadow:
          0 0 0 4px var(--bg-deep),
          0 0 0 8px var(--neon-pink),
          0 8px 0 var(--neon-purple),
          0 0 40px rgba(255, 45, 149, 0.9);
      }
    }

    /* ── GAME HUD ──────────────────────────────────────────── */
    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .hud-card {
      padding: 12px 8px;
      border: 3px solid var(--neon-cyan);
      background: var(--bg-mid);
      text-align: center;
      box-shadow: inset 0 0 12px rgba(0, 240, 255, 0.1);
    }
    .hud-label {
      font-size: 7px;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0.8;
    }
    .hud-value {
      font-size: 18px;
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow), 0 0 16px rgba(255, 242, 0, 0.5);
      letter-spacing: 1px;
    }

    /* ── MINIMAP ───────────────────────────────────────────── */
    .minimap {
      position: relative;
      height: 30px;
      border: 3px solid var(--neon-purple);
      background: var(--bg-deep);
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(176, 38, 255, 0.4);
    }
    .mini-track-line {
      position: absolute;
      left: 8px; right: 24px;
      top: 50%; height: 2px;
      transform: translateY(-50%);
      background-image: repeating-linear-gradient(
        to right,
        var(--neon-purple) 0 4px,
        transparent 4px 10px
      );
      opacity: 0.7;
    }
    .mini-finish {
      position: absolute;
      right: 4px; top: 4px; bottom: 4px;
      width: 10px;
      background: repeating-linear-gradient(to bottom, white 0 4px, var(--bg-deep) 4px 8px);
      box-shadow: 0 0 8px white;
    }
    .mini-dot {
      position: absolute;
      top: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      transition: left 0.18s linear;
    }
    .mini-dot.player {
      background: var(--neon-yellow);
      box-shadow: 0 0 8px var(--neon-yellow);
      z-index: 3;
      width: 12px; height: 12px;
    }
    .mini-dot.ai1 { background: var(--neon-cyan); box-shadow: 0 0 6px var(--neon-cyan); z-index: 2; }
    .mini-dot.ai2 { background: var(--neon-pink); box-shadow: 0 0 6px var(--neon-pink); z-index: 1; }

    /* ── RACE VIEWPORT (CRT screen) ────────────────────────── */
    .race-viewport {
      position: relative;
      height: 300px;
      overflow: hidden;
      border: 4px solid var(--neon-pink);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-pink),
        0 0 40px rgba(255, 45, 149, 0.5),
        inset 0 0 50px rgba(0, 0, 0, 0.6);
      margin-bottom: 14px;
      background:
        linear-gradient(
          to bottom,
          #1a0033 0%,
          #2a0e58 18%,
          #6b1f9c 38%,
          #ff2d95 55%,
          #ff6b00 65%,
          #2a0e58 75%,
          #0a0118 100%
        );
    }

    /* Viewport CRT scanlines (denser than global) */
    .race-viewport::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 1px,
        rgba(0, 0, 0, 0.25) 1px,
        rgba(0, 0, 0, 0.25) 2px
      );
      pointer-events: none;
      z-index: 60;
    }
    /* Viewport vignette */
    .race-viewport::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 55;
    }

    /* Pixel mountains silhouette */
    .mountains {
      position: absolute;
      left: 0; right: 0;
      bottom: 48%;
      height: 60px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 60' preserveAspectRatio='none' shape-rendering='crispEdges'><path d='M0 60 L0 36 L20 36 L20 24 L40 24 L40 12 L60 12 L60 24 L80 24 L80 36 L100 36 L100 30 L120 30 L120 18 L140 18 L140 6 L160 6 L160 24 L180 24 L180 36 L200 36 L200 30 L220 30 L220 18 L240 18 L240 30 L260 30 L260 24 L280 24 L280 12 L300 12 L300 24 L320 24 L320 30 L340 30 L340 36 L360 36 L360 24 L380 24 L380 36 L400 36 L400 60 Z' fill='%231a0033'/></svg>");
      background-size: cover;
      image-rendering: pixelated;
      z-index: 2;
    }
    /* Sun on horizon */
    .sun {
      position: absolute;
      left: 50%; bottom: 46%;
      width: 90px; height: 90px;
      transform: translate(-50%, 50%);
      background:
        linear-gradient(
          to bottom,
          #fff200 0%,
          #fff200 35%,
          transparent 38%,
          #ff6b00 41%,
          #ff6b00 48%,
          transparent 51%,
          #ff2d95 54%,
          #ff2d95 60%,
          transparent 63%,
          #b026ff 66%,
          #b026ff 73%,
          transparent 76%,
          #6b1f9c 79%,
          #6b1f9c 87%
        );
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(255, 107, 0, 0.5);
      z-index: 1;
    }

    /* Synthwave perspective grid floor */
    .grid-floor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48%;
      perspective: 220px;
      overflow: hidden;
      z-index: 3;
    }
    .grid-floor::before {
      content: '';
      position: absolute;
      left: -10%; right: -10%;
      top: 0; bottom: -30px;
      background-image:
        repeating-linear-gradient(to bottom,
          transparent 0, transparent 14px,
          var(--neon-cyan) 14px, var(--neon-cyan) 15px),
        repeating-linear-gradient(to right,
          transparent 0, transparent 30px,
          var(--neon-pink) 30px, var(--neon-pink) 31px);
      transform: rotateX(62deg);
      transform-origin: top;
      animation: grid-scroll 1.2s linear infinite;
      opacity: 0.55;
    }
    @keyframes grid-scroll {
      from { background-position-y: 0, 0; }
      to   { background-position-y: 28px, 0; }
    }

    /* Race world (the scrolling layer) */
    .race-world {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      will-change: transform;
      transition: transform 0.15s linear;
      z-index: 10;
    }
    .race-world.no-tx { transition: none; }

    /* Pixel road surface */
    .road {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 168px;
      background:
        linear-gradient(to bottom,
          rgba(0, 0, 0, 0.2) 0%,
          transparent 8%,
          transparent 92%,
          rgba(0, 0, 0, 0.2) 100%),
        #1a1a2e;
      border-top: 4px solid var(--neon-pink);
      border-bottom: 4px solid var(--neon-cyan);
      box-shadow:
        0 -2px 0 rgba(255, 45, 149, 0.4),
        0 2px 0 rgba(0, 240, 255, 0.4),
        0 0 30px rgba(255, 45, 149, 0.3),
        0 0 30px rgba(0, 240, 255, 0.3);
    }

    /* Speed lines during boost */
    .race-viewport.boosting .road::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(to right,
          rgba(255, 242, 0, 0.4) 0 4px,
          transparent 4px 16px,
          rgba(0, 240, 255, 0.4) 16px 20px,
          transparent 20px 32px,
          rgba(255, 45, 149, 0.4) 32px 36px,
          transparent 36px 48px);
      animation: streak 0.25s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes streak {
      from { transform: translateX(0); }
      to   { transform: translateX(-48px); }
    }

    /* Lane dividers - pixel dashes */
    .divider {
      position: absolute;
      left: 0; height: 4px;
      background-image: repeating-linear-gradient(
        to right,
        var(--neon-yellow) 0 16px,
        transparent 16px 32px
      );
      box-shadow: 0 0 8px var(--neon-yellow);
    }
    .div-1 { top: 50%; transform: translateY(-28px); }
    .div-2 { top: 50%; transform: translateY(24px); }

    /* Distance markers (pixel sign posts) */
    .marker-sign {
      position: absolute;
      top: 24%;
      width: 34px; height: 32px;
      transform: translateX(-50%);
      z-index: 11;
    }
    .marker-sign .post {
      position: absolute;
      left: 50%; bottom: 0;
      width: 4px; height: 16px;
      background: linear-gradient(to bottom, #555, #888);
      transform: translateX(-50%);
    }
    .marker-sign .board {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 16px;
      background: var(--neon-cyan);
      color: var(--bg-deep);
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
      box-shadow:
        0 0 0 2px var(--bg-deep),
        0 0 0 4px var(--neon-cyan),
        0 0 10px var(--neon-cyan);
    }

    /* Finish zone */
    .finish-zone {
      position: absolute;
      top: 8%; bottom: 8%;
      width: 22px;
      background-image:
        repeating-conic-gradient(
          from 0deg at 50% 50%,
          white 0 90deg,
          var(--bg-deep) 90deg 180deg
        );
      background-size: 11px 11px;
      box-shadow:
        0 0 0 3px var(--bg-deep),
        0 0 0 6px var(--neon-yellow),
        0 0 25px var(--neon-yellow);
      z-index: 9;
    }
    .finish-banner {
      position: absolute;
      top: 6px;
      font-size: 12px;
      color: var(--neon-yellow);
      text-shadow:
        0 0 8px var(--neon-yellow),
        2px 2px 0 var(--neon-pink),
        3px 3px 0 var(--neon-purple);
      letter-spacing: 3px;
      transform: translateX(-50%);
      z-index: 12;
      animation: finish-pulse 1s ease-in-out infinite alternate;
    }
    @keyframes finish-pulse {
      from { transform: translateX(-50%) scale(1); }
      to   { transform: translateX(-50%) scale(1.05); }
    }

    /* Lanes (positioned absolutely in world coords) */
    .lane {
      position: absolute;
      left: 0;
      height: 40px;
      z-index: 12;
    }
    .lane-1 { top: 50%; transform: translateY(-76px); }
    .lane-2 { top: 50%; transform: translateY(-20px); }
    .lane-3 { top: 50%; transform: translateY(36px); }

    /* Pixel cars (SVG with crispEdges + filter glow) */
    .car {
      position: absolute;
      left: 0; top: 0;
      transition: left 0.12s linear;
      filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7));
    }
    .car svg {
      display: block;
      shape-rendering: crispEdges;
    }
    .car.player {
      z-index: 20;
      filter:
        drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 8px rgba(255, 242, 0, 0.6));
    }
    .car-label {
      position: absolute;
      left: 50%; top: -16px;
      transform: translateX(-50%);
      font-size: 7px;
      letter-spacing: 1.5px;
      color: white;
      text-shadow: 1px 1px 0 var(--bg-deep), 0 0 4px var(--bg-deep);
      white-space: nowrap;
    }
    .car.player .car-label {
      color: var(--neon-yellow);
      text-shadow:
        1px 1px 0 var(--bg-deep),
        0 0 6px var(--neon-yellow);
    }
    .car.ai1 .car-label   { color: var(--neon-cyan); text-shadow: 1px 1px 0 var(--bg-deep), 0 0 5px var(--neon-cyan); }
    .car.ai2 .car-label   { color: var(--neon-pink); text-shadow: 1px 1px 0 var(--bg-deep), 0 0 5px var(--neon-pink); }

    /* Boost flash on player */
    .speed-burst { animation: burst 0.6s ease; }
    @keyframes burst {
      0%, 100% {
        filter:
          drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
          drop-shadow(0 0 8px rgba(255, 242, 0, 0.6));
      }
      30% {
        filter:
          drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
          drop-shadow(0 0 20px var(--neon-yellow))
          drop-shadow(0 0 30px var(--neon-pink))
          brightness(1.5) hue-rotate(40deg);
      }
      60% {
        filter:
          drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
          drop-shadow(0 0 20px var(--neon-cyan))
          brightness(1.5) hue-rotate(-40deg);
      }
    }
    /* Boost trail */
    .car.player.boosting::after {
      content: '';
      position: absolute;
      right: 100%; top: 50%;
      transform: translateY(-50%);
      width: 90px; height: 22px;
      background: linear-gradient(to left,
        var(--neon-yellow) 0%,
        var(--neon-orange) 30%,
        var(--neon-pink) 60%,
        transparent 100%);
      mix-blend-mode: screen;
      animation: trail 0.18s linear infinite alternate;
      margin-right: -2px;
      filter: blur(1px);
    }
    @keyframes trail {
      from { opacity: 0.8; transform: translateY(-50%) scaleX(1); }
      to   { opacity: 1;   transform: translateY(-50%) scaleX(1.25); }
    }

    .shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* ── QUESTION CARD ──────────────────────────────────────── */
    .question-card {
      padding: 22px;
      background: var(--bg-mid);
      border: 4px solid var(--neon-green);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-green),
        0 0 30px rgba(57, 255, 20, 0.4);
      position: relative;
    }
    .q-number {
      display: inline-block;
      padding: 6px 12px;
      background: var(--neon-green);
      color: var(--bg-deep);
      font-size: 8px;
      margin-bottom: 14px;
      letter-spacing: 2px;
      box-shadow: 3px 3px 0 var(--bg-deep);
    }
    .q-text {
      font-size: 13px;
      color: var(--text-cream);
      margin-bottom: 18px;
      line-height: 1.7;
      letter-spacing: 0.3px;
    }
    .q-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .answer-btn {
      display: flex;

      align-items: center;
      justify-content: center;
      background: var(--text-cream);
      color: var(--bg-deep);

      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);

      background: var(--neon-cyan);

      color: var(--neon-green);
      background: rgba(57, 255, 20, 0.12);
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.5);

      border-color: var(--neon-pink);
      color: var(--neon-pink);
      background: rgba(255, 45, 149, 0.12);
    }
    .answer-btn.wrong .letter { background: var(--neon-pink); }
    .answer-btn:disabled { cursor: default; }

    /* ── RESULT SCREEN ──────────────────────────────────────── */
    .result-card {
      padding: 36px 28px;
      text-align: center;
      border-color: var(--neon-yellow);

        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-yellow),
        0 0 40px rgba(255, 242, 0, 0.5);
    }
    .result-title-big {
      font-size: 24px;
      color: var(--neon-yellow);
      text-shadow:
        0 0 10px var(--neon-yellow),
        3px 3px 0 var(--neon-pink),
        5px 5px 0 var(--neon-purple);
      letter-spacing: 4px;
      margin-bottom: 14px;
      animation: result-glow 1.4s ease-in-out infinite alternate;
    }
    @keyframes result-glow {
      from { text-shadow: 0 0 6px var(--neon-yellow), 3px 3px 0 var(--neon-pink), 5px 5px 0 var(--neon-purple); }
      to   { text-shadow: 0 0 22px var(--neon-yellow), 3px 3px 0 var(--neon-pink), 5px 5px 0 var(--neon-purple); }
    }
    .result-sub {
      font-size: 13px;
      color: var(--text-cream);
      margin-bottom: 26px;
      line-height: 1.8;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat-card {
      padding: 16px 6px;
      border: 3px solid;
      background: var(--bg-mid);
    }
    .stat-card.gold  { border-color: var(--neon-yellow); }
    .stat-card.cyan  { border-color: var(--neon-cyan); }
    .stat-card.green { border-color: var(--neon-green); }
    .stat-label {
      font-size: 7px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0.8;
    }
    .stat-value {
      font-size: 18px;
      letter-spacing: 1px;
    }
    .stat-card.gold  .stat-value { color: var(--neon-yellow); text-shadow: 0 0 6px var(--neon-yellow); }
    .stat-card.cyan  .stat-value { color: var(--neon-cyan);   text-shadow: 0 0 6px var(--neon-cyan); }
    .stat-card.green .stat-value { color: var(--neon-green);  text-shadow: 0 0 6px var(--neon-green); }

    .rank-info {
      font-size: 8px;
      color: var(--text-cream);
      opacity: 0.75;
      margin-bottom: 22px;
      letter-spacing: 1px;
      line-height: 1.8;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-ghost, .btn-solid {
      padding: 16px;
      font-size: 10px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.1s;
    }
    .btn-ghost {
      background: transparent;
      color: var(--neon-cyan);
      border: 3px solid var(--neon-cyan);
    }
    .btn-ghost:hover {
      background: var(--neon-cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 18px var(--neon-cyan);

      background: var(--neon-pink);
      color: var(--bg-deep);
      border: 3px solid var(--neon-pink);
    }
    .btn-solid:hover {
      box-shadow: 0 0 18px var(--neon-pink);

// ── 게임 상수 ──
const RACE_TIME      = 60;
const WORLD_WIDTH    = 3200;
const FINISH_X       = WORLD_WIDTH - 80;
const PLAYER_BASE    = 1.0;
const PLAYER_BOOST   = 2.5;
const AI1_SPEED      = 1.5;
const AI2_SPEED      = 0.85;
const BOOST_DURATION = 1800;
const SLOW_DURATION  = 1000;
const CORRECT_JUMP   = 5;

let playerPos = 0, ai1Pos = 0, ai2Pos = 0;
let playerBoostUntil = 0, playerSlowUntil = 0;
let raceRunning = false;
let raceStart = 0, lastFrame = 0;
let correctCount = 0, totalAnswered = 0;
let questionPool = [];
let currentQIdx = 0;
let currentShuffled = null;
let cameraX = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── 재도전 안내 ──
(async function init() {
  try {
    const u = JSON.parse(sessionStorage.getItem('user') || '{}');
    if (!u.email) return;
    const { data } = await sb.from('game_scores')
      .select('id').eq('user_email', u.email).eq('game_type', 'security_race').limit(1);
    if (data && data.length > 0) {
      document.getElementById('replay-notice').style.display = 'block';
    }
  } catch (e) {}
})();

function setupWorld() {
  const world = document.getElementById('world');
  world.style.width = WORLD_WIDTH + 'px';
  document.getElementById('div-1').style.width = WORLD_WIDTH + 'px';
  document.getElementById('div-2').style.width = WORLD_WIDTH + 'px';

  // 거리 마커
  const markers = document.getElementById('markers');
  markers.innerHTML = '';
  [25, 50, 75].forEach(p => {
    const x = (p / 100) * FINISH_X;
    const sign = document.createElement('div');
    sign.className = 'marker-sign';
    sign.style.left = x + 'px';
    sign.innerHTML = `<div class="board">${p}%</div><div class="post"></div>`;
    markers.appendChild(sign);
  });

  // 결승선
  document.getElementById('finish-flag').style.left = FINISH_X + 'px';
  document.getElementById('finish-text').style.left = (FINISH_X + 10) + 'px';

  // 카메라 리셋
  world.classList.add('no-tx');
  world.style.transform = 'translateX(0px)';
  requestAnimationFrame(() => world.classList.remove('no-tx'));
}

function startRace() {
  playerPos = ai1Pos = ai2Pos = 0;
  cameraX = 0;
  correctCount = 0;
  totalAnswered = 0;
  currentQIdx = 0;
  playerBoostUntil = 0;
  playerSlowUntil = 0;
  questionPool = shuffle(QUESTIONS);

  document.getElementById('intro').style.display = 'none';
  document.getElementById('game').style.display = 'block';

  setupWorld();
  updateCarPos('player', 0);
  updateCarPos('ai1', 0);
  updateCarPos('ai2', 0);
  updateMinimap();

  showQuestion();

  raceStart = performance.now();
  lastFrame = performance.now();
  raceRunning = true;
  requestAnimationFrame(loop);
}

function loop(now) {
  if (!raceRunning) return;
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  const elapsed = (now - raceStart) / 1000;
  const remaining = Math.max(0, RACE_TIME - elapsed);

  let playerSpeed = PLAYER_BASE;
  const boosting = now < playerBoostUntil;
  if (boosting)              playerSpeed = PLAYER_BOOST;
  if (now < playerSlowUntil) playerSpeed = 0;
  playerPos = Math.min(100, playerPos + playerSpeed * dt);

  ai1Pos = Math.min(100, ai1Pos + AI1_SPEED * dt);
  ai2Pos = Math.min(100, ai2Pos + AI2_SPEED * dt);

  updateCarPos('player', playerPos);
  updateCarPos('ai1', ai1Pos);
  updateCarPos('ai2', ai2Pos);
  updateCamera();
  updateMinimap();

  const viewport = document.getElementById('viewport');
  const playerEl = document.getElementById('player');
  if (boosting) {
    viewport.classList.add('boosting');
    playerEl.classList.add('boosting');
  } else {
    viewport.classList.remove('boosting');
    playerEl.classList.remove('boosting');
  }

  document.getElementById('time-left').textContent     = remaining.toFixed(1);
  document.getElementById('progress-pct').textContent  = Math.round(playerPos) + '%';
  document.getElementById('correct-count').textContent = correctCount;

  if (playerPos >= 100 || remaining <= 0) {
    endRace();
    return;
  }
  requestAnimationFrame(loop);
}

function updateCarPos(id, pct) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.left = ((pct / 100) * FINISH_X) + 'px';
}

function updateCamera() {
  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const vw = viewport.offsetWidth;
  const playerWorldX = (playerPos / 100) * FINISH_X;
  let target = playerWorldX - vw * 0.32;
  target = Math.max(0, Math.min(WORLD_WIDTH - vw, target));
  cameraX = target;
  world.style.transform = `translateX(${-cameraX}px)`;
}

function updateMinimap() {
  const mini = document.querySelector('.minimap');
  if (!mini) return;
  const total = mini.offsetWidth - 32;
  const startX = 8;
  ['player', 'ai1', 'ai2'].forEach(name => {
    const dot = document.getElementById('mini-' + name);
    if (!dot) return;
    const pos = name === 'player' ? playerPos : (name === 'ai1' ? ai1Pos : ai2Pos);
    dot.style.left = (startX + (pos / 100) * total) + 'px';
  });
}

function showQuestion() {
  const q = questionPool[currentQIdx % questionPool.length];
  const tagged = q.options.map((opt, i) => ({ opt, isCorrect: i === q.answer }));
  const shuffledOpts = shuffle(tagged);
  const correctIdx = shuffledOpts.findIndex(o => o.isCorrect);
  currentShuffled = { shuffledOpts, correctIdx };

  document.getElementById('q-number').textContent = `QUESTION ${totalAnswered + 1}`;
  document.getElementById('q-text').textContent = q.q;
  const opts = document.getElementById('q-options');
  opts.innerHTML = shuffledOpts.map((o, i) =>
    `<button class="answer-btn" onclick="answer(${i})">
       <span class="letter">${'ABCD'[i]}</span>
       <span class="ko">${o.opt}</span>
     </button>`
  ).join('');
}

function answer(idx) {
  if (!currentShuffled) return;
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(b => b.disabled = true);

  const correct = (idx === currentShuffled.correctIdx);
  if (correct) {
    buttons[idx].classList.add('correct');
    correctCount++;
    playerPos = Math.min(100, playerPos + CORRECT_JUMP);
    playerBoostUntil = performance.now() + BOOST_DURATION;
    const player = document.getElementById('player');
    player.classList.add('speed-burst');
    setTimeout(() => player.classList.remove('speed-burst'), 600);
  } else {
    buttons[idx].classList.add('wrong');
    buttons[currentShuffled.correctIdx].classList.add('correct');
    playerSlowUntil = performance.now() + SLOW_DURATION;
    const player = document.getElementById('player');
    player.classList.add('shake');
    setTimeout(() => player.classList.remove('shake'), 400);
  }
  totalAnswered++;

  setTimeout(() => {
    if (!raceRunning) return;
    currentQIdx++;
    showQuestion();
  }, 900);
}

function endRace() {
  raceRunning = false;
  document.getElementById('viewport').classList.remove('boosting');
  const playerEl = document.getElementById('player');
  if (playerEl) playerEl.classList.remove('boosting');

  const elapsed = Math.min(RACE_TIME, (performance.now() - raceStart) / 1000);
  const finished = playerPos >= 100;

  const positions = [
    { name: 'YOU', pos: playerPos },
    { name: 'AI 1', pos: ai1Pos },
    { name: 'AI 2', pos: ai2Pos },
  ].sort((a, b) => b.pos - a.pos);
  const myRank = positions.findIndex(p => p.name === 'YOU') + 1;

  let finalScore, subText, bigTitle;
  if (finished) {
    const timeBonus = Math.round((RACE_TIME - elapsed) / RACE_TIME * 30);
    finalScore = Math.min(100, 70 + timeBonus);
    if (myRank === 1) {
      bigTitle = '★ 1ST PLACE ★';
      subText = '모든 차를 제치고 우승했습니다!';
    } else if (myRank === 2) {
      bigTitle = 'RACE CLEAR';
      subText = '2등 — 결승선을 통과했습니다!';
    } else {
      bigTitle = 'RACE CLEAR';
      subText = '결승선 통과! 시간 내 완주했습니다.';
    }
  } else {
    finalScore = Math.round(playerPos * 0.7);
    bigTitle = 'TIME UP';
    subText = '시간 초과 — 다음엔 더 빠르게 답해보세요.';
  }

  document.getElementById('game').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('result-title-big').textContent = bigTitle;
  document.getElementById('result-sub').textContent = subText;
  document.getElementById('final-score').textContent = finalScore;
  document.getElementById('final-progress').textContent = Math.round(playerPos) + '%';
  document.getElementById('final-correct').textContent = `${correctCount}/${totalAnswered}`;
  document.getElementById('rank-info').textContent =
    `RANK ${myRank} / 3   ·   ` + positions.map(p => `${p.name} ${Math.round(p.pos)}%`).join(' · ');

  saveScore(finalScore);
}

async function saveScore(score) {
  try {
    const u = JSON.parse(sessionStorage.getItem('user') || '{}');
    if (!u.email) return;
    const { data: existing } = await sb.from('game_scores')
      .select('id').eq('user_email', u.email).eq('game_type', 'security_race').limit(1);
    if (existing && existing.length > 0) return;
    await sb.from('game_scores').insert({
      user_email: u.email,
      game_type:  'security_race',
      score:      score,
    });
  } catch (e) {}
}
</script>
