<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 교육 플랫폼 — 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #ECEAE6; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .nav-item { transition: background 0.12s; border-radius: 12px; }
    .nav-item:hover { background: #F5F3F0; }
    .nav-item.active { background: #F0EDEA; }
    .course-card { transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; }
    .course-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .course-card:active { transform: translateY(0); }
    .filter-btn { transition: background 0.12s, color 0.12s; }
    .filter-btn:focus { outline: none; box-shadow: 0 0 0 2px #1a1a1a; }
    .progress-bar { height: 4px; background: #E4E1DD; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: #1A1A1A; transition: width 0.6s ease; }
  </style>
</head>
<body class="h-screen overflow-hidden">

<div class="flex h-full">

  <!-- ── Sidebar ── -->
  <aside class="w-72 flex-shrink-0 p-4 flex flex-col gap-3 overflow-y-auto">
    <div class="bg-white rounded-3xl p-5 flex flex-col gap-4 shadow-sm">

      <!-- 프로필 -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl flex items-center justify-center flex-shrink-0" style="background:#E8E5E1;">
            <svg class="w-5 h-5" style="color:#BDBAB6;" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
          <div>
            <p id="user-name" class="text-sm font-semibold text-gray-900 leading-tight">김보안</p>
            <p id="user-dept" class="text-xs mt-0.5" style="color:#B0ADA9;">IT 인프라팀</p>
          </div>
        </div>
        <button onclick="logout()" title="로그아웃"
          class="w-8 h-8 rounded-xl flex items-center justify-center transition-colors hover:bg-gray-100">
          <svg class="w-4 h-4" style="color:#B0ADA9;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>

      <!-- 보안 스코어 -->
      <div class="rounded-2xl px-4 py-3" style="background:#F5F3F0;">
        <p class="text-xs font-medium tracking-widest uppercase mb-1" style="color:#B0ADA9;">My Security Score</p>
        <p class="text-3xl font-bold text-gray-900" id="security-score">0</p>
        <div class="progress-bar mt-2">
          <div class="progress-fill" id="score-bar" style="width:0%"></div>
        </div>
        <p class="text-xs mt-1.5" style="color:#B0ADA9;">목표: 1,000점</p>
      </div>

      <!-- 네비게이션 -->
      <nav class="flex flex-col gap-0.5" id="nav-menu">
        <a href="#" class="nav-item active flex items-center justify-between px-3 py-2.5" onclick="event.preventDefault(); filterCourses('all', this)">
          <span class="text-sm text-gray-700">전체 교육</span>
          <span class="text-xs font-medium text-gray-400 bg-gray-100 rounded-full px-2 py-0.5" id="badge-all">5</span>
        </a>
        <a href="#" class="nav-item flex items-center justify-between px-3 py-2.5" onclick="event.preventDefault(); filterCourses('inprogress', this)">
          <span class="text-sm text-gray-700">수강 중</span>
          <span class="text-xs font-medium text-gray-400 bg-gray-100 rounded-full px-2 py-0.5" id="badge-inprogress">5</span>
        </a>
        <a href="#" class="nav-item flex items-center justify-between px-3 py-2.5" onclick="event.preventDefault(); filterCourses('completed', this)">
          <span class="text-sm text-gray-700">완료된 교육</span>
          <span class="text-xs font-medium text-gray-400 bg-gray-100 rounded-full px-2 py-0.5" id="badge-completed">0</span>
        </a>
        <a href="#" class="nav-item flex items-center justify-between px-3 py-2.5" onclick="event.preventDefault(); filterCourses('exam', this)">
          <span class="text-sm text-gray-700">시험 결과</span>
        </a>
        <a href="#" class="nav-item flex items-center justify-between px-3 py-2.5" onclick="event.preventDefault(); filterCourses('achievements', this)">
          <span class="text-sm text-gray-700">내 성과</span>
        </a>
        <a href="#" class="nav-item flex items-center justify-between px-3 py-2.5" onclick="event.preventDefault(); filterCourses('leaderboard', this)">
          <span class="text-sm text-gray-700">리더보드</span>
        </a>
      </nav>

    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="flex-1 overflow-y-auto p-4 pl-0 pr-5">

    <!-- 강의 그리드 -->
    <div class="grid grid-cols-3 gap-3" id="course-grid"></div>

  </main>
</div>

<script>
  const stored = sessionStorage.getItem('user');
  if (!stored) location.href = 'login.html';
  const user = stored ? JSON.parse(stored) : {};
  document.getElementById('user-name').textContent = user.name || '사용자';
  document.getElementById('user-dept').textContent = user.dept || '';

  function logout() {
    sessionStorage.removeItem('user');
    location.href = 'login.html';
  }

  // 강의 목록은 Supabase에서 로드 (admin-courses.html에서 관리)
  let courses = [];
  let gameTypeNames = {};
  let maxScores = {};

  async function loadCourses() {
    const { data, error } = await sb.from('courses').select('*').eq('active', true).order('sort_order', { ascending: true });
    if (error || !data) return;
    courses = data.map(c => ({
      id: c.id,
      title: c.title,
      sub: c.subtitle || '',
      color: c.color || '#1A1A1A',
      link: c.link,
      gameType: c.game_type,
      maxScore: c.max_score || 0,
      status: 'inprogress',
    }));
    // 헬퍼 맵 빌드
    courses.forEach(c => {
      if (c.gameType) {
        gameTypeNames[c.gameType] = c.title;
        maxScores[c.gameType] = c.maxScore;
      }
    });
  }

  let currentFilter = 'all';
  let examScores = [];

  function updateBadges() {
    document.getElementById('badge-all').textContent = courses.length;
    document.getElementById('badge-inprogress').textContent = courses.filter(c=>c.status==='inprogress').length;
    document.getElementById('badge-completed').textContent = courses.filter(c=>c.status==='completed').length;
  }

  async function renderLeaderboard() {
    const grid = document.getElementById('course-grid');
    grid.innerHTML = `<div class="col-span-3 flex items-center justify-center py-20">
      <p class="text-sm text-gray-400">리더보드 불러오는 중...</p>
    </div>`;
    try {
      const [{ data: scores }, { data: profiles }] = await Promise.all([
        sb.from('game_scores').select('user_email, game_type, score'),
        sb.from('profiles').select('email, name, dept').neq('role', 'admin'),
      ]);
      if (!scores || !profiles || profiles.length === 0) {
        grid.innerHTML = `<div class="col-span-3 flex items-center justify-center py-20">
          <p class="text-sm text-gray-400">아직 점수 데이터가 없습니다.</p>
        </div>`;
        return;
      }
      // 유저별 게임타입별 최고점 집계
      const bestMap = {}; // { email: { gameType: bestScore } }
      scores.forEach(s => {
        if (!bestMap[s.user_email]) bestMap[s.user_email] = {};
        if (!bestMap[s.user_email][s.game_type] || s.score > bestMap[s.user_email][s.game_type])
          bestMap[s.user_email][s.game_type] = s.score;
      });
      // 유저별 총점 계산
      const rows = profiles.map(p => {
        const best = bestMap[p.email] || {};
        const total = Object.values(best).reduce((a, b) => a + b, 0);
        return { name: p.name || p.email, dept: p.dept || '—', total, best, email: p.email };
      }).filter(r => r.total > 0).sort((a, b) => b.total - a.total);

      // 동점 처리: 같은 점수면 같은 순위
      let rankNum = 0, prevTotal = -1, sameCount = 0;
      rows.forEach((r, i) => {
        if (r.total !== prevTotal) { rankNum += sameCount + 1; sameCount = 0; }
        else sameCount++;
        r.rank = rankNum;
        prevTotal = r.total;
      });

      if (rows.length === 0) {
        grid.innerHTML = `<div class="col-span-3 flex items-center justify-center py-20">
          <p class="text-sm text-gray-400">아직 게임을 플레이한 사용자가 없습니다.</p>
        </div>`;
        return;
      }
      const myEmail = user.email;
      grid.innerHTML = `<div class="col-span-3 bg-white rounded-3xl overflow-hidden shadow-sm">
        <div class="px-5 py-4 border-b border-gray-50 flex items-center justify-between">
          <p class="text-sm font-semibold text-gray-900">전사 리더보드</p>
          <p class="text-xs text-gray-400">게임별 최고점 합산 기준</p>
        </div>
        <table class="w-full text-sm">
          <thead><tr style="background:#F5F3F0;">
            <th class="px-5 py-3 text-left text-xs font-medium text-gray-500 w-12">순위</th>
            <th class="px-5 py-3 text-left text-xs font-medium text-gray-500">이름</th>
            <th class="px-5 py-3 text-left text-xs font-medium text-gray-500">부서</th>
            <th class="px-5 py-3 text-right text-xs font-medium text-gray-500">총점</th>
          </tr></thead>
          <tbody>${rows.map((r, i) => {
            const isMe = r.email === myEmail;
            const rank = r.rank;
            return `<tr class="border-t border-gray-50${isMe ? '" style="background:#F5F3FF;' : ''}">
              <td class="px-5 py-3 text-center font-medium text-gray-500">${rank}</td>
              <td class="px-5 py-3 font-medium ${isMe ? 'text-purple-700' : 'text-gray-900'}">${r.name}${isMe ? ' <span class="text-xs text-purple-400">(나)</span>' : ''}</td>
              <td class="px-5 py-3 text-gray-400">${r.dept}</td>
              <td class="px-5 py-3 text-right font-bold ${isMe ? 'text-purple-700' : 'text-gray-900'}">${r.total.toLocaleString()}점</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;
    } catch(e) {
      grid.innerHTML = `<div class="col-span-3 flex items-center justify-center py-20">
        <p class="text-sm text-gray-400">리더보드를 불러올 수 없습니다.</p>
      </div>`;
    }
  }

  // ── 뱃지/업적 정의 (동적으로 계산) ──
  const BADGE_DEFS = [
    {
      id: 'first_step',
      title: '첫 발걸음',
      desc: '첫 게임 완료',
      check: (s) => s.scores.length >= 1,
    },
    {
      id: 'all_games',
      title: '완주자',
      desc: '모든 게임을 한 번 이상 시도',
      check: (s) => {
        const gameCourses = s.courses.filter(c => c.gameType);
        if (!gameCourses.length) return false;
        const playedTypes = new Set(s.scores.map(x => x.game_type));
        return gameCourses.every(c => playedTypes.has(c.gameType));
      },
    },
    {
      id: 'high_scorer',
      title: '고득점자',
      desc: '한 게임에서 만점의 80% 이상 달성',
      check: (s) => {
        const best = {};
        s.scores.forEach(x => { if (!best[x.game_type] || x.score > best[x.game_type]) best[x.game_type] = x.score; });
        return Object.entries(best).some(([t, sc]) => {
          const max = s.courses.find(c => c.gameType === t)?.maxScore || 1000;
          return max > 0 && sc / max >= 0.8;
        });
      },
    },
    {
      id: 'safe_eyes',
      title: '안전한 눈',
      desc: '피싱 메일에 속지 않음',
      check: (s) => s.profile.phishing_clicked === false,
    },
    {
      id: 'persistent',
      title: '끈기왕',
      desc: '게임 10회 이상 플레이',
      check: (s) => s.scores.length >= 10,
    },
    {
      id: 'master',
      title: '보안 마스터',
      desc: '모든 게임에서 만점의 60% 이상',
      check: (s) => {
        const gameCourses = s.courses.filter(c => c.gameType);
        if (!gameCourses.length) return false;
        const best = {};
        s.scores.forEach(x => { if (!best[x.game_type] || x.score > best[x.game_type]) best[x.game_type] = x.score; });
        return gameCourses.every(c => {
          const sc = best[c.gameType] || 0;
          return c.maxScore > 0 && sc / c.maxScore >= 0.6;
        });
      },
    },
  ];

  let achievementCharts = [];

  async function renderAchievements() {
    const grid = document.getElementById('course-grid');
    grid.innerHTML = `<div class="col-span-3 flex items-center justify-center py-20">
      <p class="text-sm text-gray-400">불러오는 중...</p>
    </div>`;

    // 데이터 fetch
    const [scoresRes, profileRes] = await Promise.all([
      sb.from('game_scores').select('*').eq('user_email', user.email).order('created_at', { ascending: true }),
      sb.from('profiles').select('phishing_clicked, completion').eq('email', user.email).limit(1).single(),
    ]);
    const scores = scoresRes.data || [];
    const profile = profileRes.data || {};

    // 뱃지 계산
    const ctx = { scores, profile, courses };
    const earnedBadges = BADGE_DEFS.map(b => ({ ...b, earned: b.check(ctx) }));
    const earnedCount = earnedBadges.filter(b => b.earned).length;

    // 게임별 최고점 집계
    const bestByType = {};
    scores.forEach(s => {
      if (!bestByType[s.game_type] || s.score > bestByType[s.game_type]) bestByType[s.game_type] = s.score;
    });

    // 약점 게임 추천: 비율 가장 낮은 게임 OR 미플레이 게임
    const gameCourses = courses.filter(c => c.gameType);
    const notPlayed = gameCourses.filter(c => !(c.gameType in bestByType));
    let recommendation = null;
    if (notPlayed.length > 0) {
      recommendation = {
        course: notPlayed[0],
        reason: '아직 도전하지 않은 게임이 있어요.',
        type: 'new',
      };
    } else if (gameCourses.length > 0) {
      const withRatio = gameCourses.map(c => ({
        course: c,
        ratio: c.maxScore > 0 ? (bestByType[c.gameType] || 0) / c.maxScore : 1,
        score: bestByType[c.gameType] || 0,
      })).sort((a, b) => a.ratio - b.ratio);
      const weakest = withRatio[0];
      if (weakest.ratio < 0.8) {
        recommendation = {
          course: weakest.course,
          reason: `현재 ${weakest.score}점 (만점 대비 ${Math.round(weakest.ratio * 100)}%) — 더 높은 점수에 도전해보세요.`,
          type: 'weak',
          ratio: weakest.ratio,
        };
      }
    }

    // 기존 차트 정리
    achievementCharts.forEach(c => { try { c.destroy(); } catch(e){} });
    achievementCharts = [];

    // ── 렌더링 ──
    grid.innerHTML = `
      <!-- 뱃지 섹션 -->
      <div class="col-span-3 bg-white rounded-3xl shadow-sm overflow-hidden">
        <div class="px-6 py-5 border-b border-gray-50 flex items-center justify-between">
          <div>
            <p class="text-base font-semibold text-gray-900">획득 뱃지</p>
            <p class="text-xs mt-1" style="color:#B0ADA9;">${earnedCount} / ${BADGE_DEFS.length}개 달성</p>
          </div>
          <div class="text-right">
            <p class="text-2xl font-bold text-gray-900">${earnedCount}<span class="text-sm font-normal" style="color:#B0ADA9;"> / ${BADGE_DEFS.length}</span></p>
          </div>
        </div>
        <div class="p-6 grid grid-cols-3 gap-3">
          ${earnedBadges.map(b => `
            <div class="rounded-2xl p-4 flex items-center gap-3" style="background:${b.earned ? '#F0FDF4' : '#F5F3F0'};opacity:${b.earned ? '1' : '0.6'};">
              <div class="w-11 h-11 rounded-2xl flex items-center justify-center flex-shrink-0 text-sm font-bold" style="background:${b.earned ? '#16A34A' : '#B0ADA9'};color:white;">
                ${b.earned ? '✓' : '·'}
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold ${b.earned ? 'text-gray-900' : 'text-gray-500'}">${b.title}</p>
                <p class="text-xs mt-0.5 truncate" style="color:#8C8984;">${b.desc}</p>
              </div>
            </div>`).join('')}
        </div>
      </div>

      <!-- 통계 차트 (2개 가로) -->
      <div class="col-span-2 bg-white rounded-3xl shadow-sm p-6">
        <p class="text-sm font-semibold text-gray-900 mb-1">게임별 최고점</p>
        <p class="text-xs mb-4" style="color:#B0ADA9;">각 게임에서의 최고 점수 (만점 대비)</p>
        <div style="height:240px;"><canvas id="chart-best"></canvas></div>
      </div>

      <div class="col-span-1 bg-white rounded-3xl shadow-sm p-6">
        <p class="text-sm font-semibold text-gray-900 mb-1">총 활동</p>
        <p class="text-xs mb-4" style="color:#B0ADA9;">누적 통계</p>
        <div class="flex flex-col gap-3 mt-5">
          <div class="rounded-2xl px-4 py-3" style="background:#F5F3F0;">
            <p class="text-xs" style="color:#B0ADA9;">총 게임 횟수</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">${scores.length}<span class="text-xs font-normal" style="color:#B0ADA9;"> 회</span></p>
          </div>
          <div class="rounded-2xl px-4 py-3" style="background:#F5F3F0;">
            <p class="text-xs" style="color:#B0ADA9;">참여한 게임 종류</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">${Object.keys(bestByType).length}<span class="text-xs font-normal" style="color:#B0ADA9;"> / ${gameCourses.length}</span></p>
          </div>
          <div class="rounded-2xl px-4 py-3" style="background:#F5F3F0;">
            <p class="text-xs" style="color:#B0ADA9;">최고점 합계</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">${Object.values(bestByType).reduce((a,b)=>a+b,0).toLocaleString()}<span class="text-xs font-normal" style="color:#B0ADA9;"> 점</span></p>
          </div>
        </div>
      </div>

      <!-- 점수 추이 + 약점 추천 -->
      <div class="col-span-2 bg-white rounded-3xl shadow-sm p-6">
        <p class="text-sm font-semibold text-gray-900 mb-1">점수 추이</p>
        <p class="text-xs mb-4" style="color:#B0ADA9;">최근 게임 플레이 순서대로</p>
        <div style="height:200px;"><canvas id="chart-trend"></canvas></div>
      </div>

      <div class="col-span-1 bg-white rounded-3xl shadow-sm p-6">
        <p class="text-sm font-semibold text-gray-900 mb-1">추천 게임</p>
        <p class="text-xs mb-4" style="color:#B0ADA9;">개인화 추천</p>
        ${recommendation ? `
          <a href="${recommendation.course.link}" class="block rounded-2xl p-4 transition hover:shadow-md cursor-pointer" style="background:${recommendation.course.color};">
            <p class="text-xs font-medium mb-1" style="color:rgba(255,255,255,0.7);">${recommendation.type === 'new' ? '새로운 도전' : '약점 보완'}</p>
            <p class="text-base font-bold text-white">${recommendation.course.title}</p>
            <p class="text-xs mt-2 leading-relaxed" style="color:rgba(255,255,255,0.85);">${recommendation.reason}</p>
          </a>` : `
          <div class="rounded-2xl p-4 text-center" style="background:#F0FDF4;">
            <p class="text-sm font-medium" style="color:#16A34A;">훌륭합니다!</p>
            <p class="text-xs mt-1" style="color:#8C8984;">모든 게임에서 좋은 성적을 거두고 있어요.</p>
          </div>`}
      </div>`;

    // 차트 렌더링
    const gameLabels = gameCourses.map(c => c.title);
    const bestData = gameCourses.map(c => bestByType[c.gameType] || 0);
    const maxData = gameCourses.map(c => c.maxScore || 0);

    const bestCtx = document.getElementById('chart-best');
    if (bestCtx) {
      achievementCharts.push(new Chart(bestCtx, {
        type: 'bar',
        data: {
          labels: gameLabels,
          datasets: [
            { label: '내 최고점', data: bestData, backgroundColor: '#1A1A1A', borderRadius: 6, barPercentage: 0.55 },
            { label: '만점', data: maxData, backgroundColor: '#E4E1DD', borderRadius: 6, barPercentage: 0.55 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { family: 'Noto Sans KR', size: 11 }, color: '#6B7280', boxWidth: 10 } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#B0ADA9', font: { size: 10 } } },
            y: { beginAtZero: true, grid: { color: '#F5F3F0' }, ticks: { color: '#B0ADA9', font: { size: 11 } } },
          },
        },
      }));
    }

    const trendCtx = document.getElementById('chart-trend');
    if (trendCtx) {
      const trendLabels = scores.map((_, i) => `#${i + 1}`);
      const trendData = scores.map(s => s.score || 0);
      achievementCharts.push(new Chart(trendCtx, {
        type: 'line',
        data: {
          labels: trendLabels.length ? trendLabels : ['-'],
          datasets: [{
            label: '점수',
            data: trendData.length ? trendData : [0],
            borderColor: '#1A1A1A',
            backgroundColor: 'rgba(26, 26, 26, 0.06)',
            tension: 0.35,
            fill: true,
            pointBackgroundColor: '#1A1A1A',
            pointRadius: 3,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#B0ADA9', font: { size: 10 } } },
            y: { beginAtZero: true, grid: { color: '#F5F3F0' }, ticks: { color: '#B0ADA9', font: { size: 11 } } },
          },
        },
      }));
    }
  }

  function renderCourses() {
    const grid = document.getElementById('course-grid');

    if (currentFilter === 'leaderboard') {
      renderLeaderboard();
      return;
    }

    if (currentFilter === 'achievements') {
      renderAchievements();
      return;
    }

    if (currentFilter === 'exam') {
      if (examScores.length === 0) {
        grid.innerHTML = `<div class="col-span-3 flex items-center justify-center py-20">
          <p class="text-sm font-medium text-gray-400">아직 시험 결과가 없습니다.</p>
        </div>`;
        return;
      }
      const best = {};
      examScores.forEach(s => { if (!best[s.game_type] || s.score > best[s.game_type]) best[s.game_type] = s.score; });
      grid.innerHTML = `<div class="col-span-3 bg-white rounded-3xl overflow-hidden shadow-sm">
        <table class="w-full text-sm">
          <thead><tr style="background:#F5F3F0;">
            <th class="px-5 py-3 text-left text-xs font-medium text-gray-500">교육명</th>
            <th class="px-5 py-3 text-right text-xs font-medium text-gray-500">최고 점수</th>
            <th class="px-5 py-3 text-right text-xs font-medium text-gray-500">만점</th>
            <th class="px-5 py-3 text-center text-xs font-medium text-gray-500">결과</th>
          </tr></thead>
          <tbody>${Object.entries(best).map(([type, score]) => {
            const max = maxScores[type] || 1000;
            const pass = score / max >= 0.6;
            return `<tr class="border-t border-gray-50">
              <td class="px-5 py-3 font-medium text-gray-900">${gameTypeNames[type]||type}</td>
              <td class="px-5 py-3 text-right font-bold text-gray-900">${score}점</td>
              <td class="px-5 py-3 text-right text-gray-400">${max}점</td>
              <td class="px-5 py-3 text-center"><span class="text-xs px-2 py-0.5 rounded-full font-medium" style="${pass?'background:#F0FDF4;color:#16A34A;':'background:#FEF2F2;color:#DC2626;'}">${pass?'통과':'재도전'}</span></td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;
      return;
    }

    let list = courses;
    if (currentFilter === 'inprogress') list = courses.filter(c => c.status === 'inprogress');
    else if (currentFilter === 'completed') list = courses.filter(c => c.status === 'completed');

    if (list.length === 0) {
      grid.innerHTML = `<div class="col-span-3 flex items-center justify-center py-20">
        <p class="text-sm font-medium text-gray-400">해당하는 교육이 없습니다.</p>
      </div>`;
      return;
    }

    grid.innerHTML = list.map(c => `
      <div class="course-card bg-white rounded-3xl overflow-hidden shadow-sm" onclick="location.href='${c.link}'">
        <div style="aspect-ratio:16/9; background:${c.color};"></div>
        <div class="px-4 py-3">
          <p class="text-sm font-semibold text-gray-900 leading-snug">${c.title}</p>
          <p class="text-xs mt-1" style="color:#B0ADA9;">${c.sub}</p>
          <div class="mt-2">
            <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="${c.status==='completed'?'background:#F0FDF4;color:#16A34A;':'background:#F5F3F0;color:#8C8984;'}">${c.status==='completed'?'완료':'수강 중'}</span>
          </div>
        </div>
      </div>`).join('');
  }

  function filterCourses(f, el) {
    currentFilter = f;
    document.querySelectorAll('#nav-menu a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    renderCourses();
  }

  async function loadUserData() {
    try {
      const { data: scores } = await sb.from('game_scores')
        .select('*').eq('user_email', user.email);

      if (scores && scores.length > 0) {
        examScores = scores;
        const completedTypes = new Set(scores.map(s => s.game_type));
        courses.forEach(c => {
          if (c.gameType && completedTypes.has(c.gameType)) c.status = 'completed';
        });
        const best = {};
        scores.forEach(s => { if (!best[s.game_type] || s.score > best[s.game_type]) best[s.game_type] = s.score; });
        const total = Object.values(best).reduce((a, b) => a + b, 0);
        const maxTotal = courses.reduce((sum, c) => sum + (c.maxScore || 0), 0) || 2600;
        document.getElementById('security-score').textContent = total.toLocaleString();
        document.getElementById('score-bar').style.width = Math.min(100, Math.round(total / maxTotal * 100)) + '%';
      } else {
        // game_scores 조회 실패 시 profiles.completion으로 보완
        const { data: prof } = await sb.from('profiles').select('completion').eq('email', user.email).limit(1);
        const comp = prof?.[0]?.completion || 0;
        if (comp > 0) {
          const doneCount = Math.round(comp / 100 * courses.length);
          courses.slice(0, doneCount).forEach(c => { c.status = 'completed'; });
        }
      }

      updateBadges();
      renderCourses();
    } catch(e) {}
  }

  // 부트스트랩: 강의 → 사용자 데이터 → 렌더 순서로
  (async () => {
    await loadCourses();
    updateBadges();
    renderCourses();
    await loadUserData();
  })();
</script>
</body>
</html>
