<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 교육 플랫폼 — 피싱 훈련</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #ECEAE6; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .nav-item { transition: background 0.12s; border-radius: 12px; }
    .nav-item:hover { background: #F5F3F0; }
    .nav-item.active { background: #F0EDEA; }
    .card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .stat-card { background: white; border-radius: 24px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .badge-green { background: #F0FDF4; color: #16A34A; }
    .badge-red   { background: #FEF2F2; color: #DC2626; }
    .badge-amber { background: #FFFBEB; color: #D97706; }
    .badge-gray  { background: #F5F3F0; color: #6B7280; }
    .btn-sm { padding: 7px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.12s; border: none; }
    .btn-dark    { background: #1A1A1A; color: white; }
    .btn-dark:hover { background: #333; }
    .btn-outline { background: white; color: #374151; border: 1.5px solid #E4E1DD; }
    .btn-outline:hover { background: #F5F3F0; }
    .progress-bar { height: 6px; background: #E4E1DD; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.3); backdrop-filter:blur(4px); z-index:40; display:flex; align-items:center; justify-content:center; }
    .modal-box { background:white; border-radius:24px; padding:28px; width:500px; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.15); }
    .row-hover:hover { background: #FAFAF9; }
  </style>
</head>
<body class="h-screen overflow-hidden">

<div class="flex h-full">

  <!-- ── Sidebar ── -->
  <aside class="w-64 flex-shrink-0 p-4 flex flex-col gap-3 overflow-y-auto">
    <div class="bg-white rounded-3xl p-5 flex flex-col gap-4 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:#1A1A1A;">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-900">보안 교육 관리</p>
          <p class="text-xs" style="color:#B0ADA9;">Administrator</p>
        </div>
      </div>
      <div class="flex items-center justify-between px-1">
        <div>
          <p id="admin-name" class="text-sm font-medium text-gray-800">이담당</p>
          <p class="text-xs" style="color:#B0ADA9;">보안팀</p>
        </div>
        <button onclick="logout()" class="w-8 h-8 rounded-xl flex items-center justify-center hover:bg-gray-100">
          <svg class="w-4 h-4" style="color:#B0ADA9;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
      <div style="height:1px; background:#F0EDEA;"></div>
      <nav class="flex flex-col gap-0.5">
        <a href="admin.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <span class="text-sm text-gray-500">대시보드</span>
        </a>
        <a href="admin-users.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <span class="text-sm text-gray-500">수강생 관리</span>
        </a>
        <a href="admin-phishing.html" class="nav-item active flex items-center gap-2.5 px-3 py-2.5">
          <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="text-sm text-gray-700">피싱 훈련</span>
        </a>
        <a href="admin-settings.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          </svg>
          <span class="text-sm text-gray-500">설정</span>
        </a>
      </nav>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="flex-1 overflow-y-auto p-4 pl-0 pr-5">

    <!-- 헤더 -->
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-lg font-bold text-gray-900">피싱 훈련</h1>
        <p class="text-xs mt-0.5" style="color:#B0ADA9;">모의 피싱 메일 발송 및 결과 관리</p>
      </div>
      <div class="flex gap-2">
        <button class="btn-sm" onclick="resetPhishing()" style="background:#FEF2F2;color:#DC2626;border:1.5px solid #FECACA;">
          <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          피싱 결과 초기화
        </button>
        <button class="btn-sm btn-dark" onclick="openSendModal()">훈련 메일 발송</button>
      </div>
    </div>

    <!-- 요약 KPI -->
    <div class="grid grid-cols-4 gap-3 mb-4">
      <div class="stat-card">
        <p class="text-xs font-medium tracking-widest uppercase mb-2" style="color:#B0ADA9;">총 수강생</p>
        <p class="text-3xl font-bold text-gray-900" id="kpi-total">-</p>
        <p class="text-xs mt-1.5" style="color:#B0ADA9;">등록된 수강생 수</p>
      </div>
      <div class="stat-card">
        <p class="text-xs font-medium tracking-widest uppercase mb-2" style="color:#B0ADA9;">클릭률</p>
        <p class="text-3xl font-bold" style="color:#DC2626;" id="kpi-click-rate">-</p>
        <p class="text-xs mt-1.5" style="color:#B0ADA9;" id="kpi-click-sub">-</p>
      </div>
      <div class="stat-card">
        <p class="text-xs font-medium tracking-widest uppercase mb-2" style="color:#B0ADA9;">안전 통과</p>
        <p class="text-3xl font-bold" style="color:#16A34A;" id="kpi-safe-rate">-</p>
        <p class="text-xs mt-1.5" style="color:#B0ADA9;" id="kpi-safe-sub">-</p>
      </div>
      <div class="stat-card">
        <p class="text-xs font-medium tracking-widest uppercase mb-2" style="color:#B0ADA9;">피싱 미클릭</p>
        <p class="text-3xl font-bold text-gray-900" id="kpi-safe-count">-</p>
        <p class="text-xs mt-1.5" style="color:#B0ADA9;">안전 통과 인원</p>
      </div>
    </div>

    <!-- 훈련 회차 이력 -->
    <div class="card mb-4">
      <p class="text-sm font-semibold text-gray-900 mb-4">훈련 회차 이력</p>
      <table class="w-full text-sm">
        <thead>
          <tr style="border-bottom:1.5px solid #F0EDEA;">
            <th class="text-left text-xs font-medium pb-2.5" style="color:#B0ADA9;">회차</th>
            <th class="text-left text-xs font-medium pb-2.5" style="color:#B0ADA9;">발송일</th>
            <th class="text-left text-xs font-medium pb-2.5" style="color:#B0ADA9;">메일 유형</th>
            <th class="text-left text-xs font-medium pb-2.5" style="color:#B0ADA9;">발송 수</th>
          </tr>
        </thead>
        <tbody id="sessions-tbody">
          <tr><td colspan="4" class="text-center py-10 text-sm" style="color:#B0ADA9;">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 이번 회차 수강생별 결과 -->
    <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
      <div class="px-5 py-4 flex items-center justify-between" style="border-bottom:1.5px solid #F0EDEA;">
        <p class="text-sm font-semibold text-gray-800">이번 회차 수강생별 결과 (3회차)</p>
        <div class="flex gap-2">
          <button class="btn-sm btn-outline" onclick="filterPhishing('all', this)" id="pf-all" style="background:#1A1A1A;color:white;border-color:#1A1A1A;">전체</button>
          <button class="btn-sm btn-outline" onclick="filterPhishing('clicked', this)" id="pf-clicked">클릭함</button>
          <button class="btn-sm btn-outline" onclick="filterPhishing('safe', this)"   id="pf-safe">안전</button>
        </div>
      </div>
      <table class="w-full text-sm">
        <thead>
          <tr style="border-bottom:1.5px solid #F0EDEA;">
            <th class="text-left text-xs font-medium px-5 py-3" style="color:#B0ADA9;">이름</th>
            <th class="text-left text-xs font-medium px-4 py-3" style="color:#B0ADA9;">부서</th>
            <th class="text-left text-xs font-medium px-4 py-3" style="color:#B0ADA9;">결과</th>
            <th class="text-left text-xs font-medium px-4 py-3" style="color:#B0ADA9;">클릭 시각</th>
            <th class="text-left text-xs font-medium px-4 py-3" style="color:#B0ADA9;">교육 이수율</th>
          </tr>
        </thead>
        <tbody id="phishing-tbody"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- 훈련 메일 발송 모달 -->
<div id="send-modal" class="modal-backdrop hidden" onclick="closeSendOnBackdrop(event)">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-base font-bold text-gray-900">피싱 훈련 메일 발송</h2>
      <button onclick="closeSendModal()" class="w-8 h-8 rounded-xl flex items-center justify-center hover:bg-gray-100">
        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1.5">피싱 메일 유형</label>
        <select id="send-email-type" onchange="onEmailTypeChange()" class="w-full rounded-xl border border-gray-200 p-2.5 text-sm outline-none focus:border-gray-800" style="background:#FAF9F7;">
          <option>계정 보안 알림 (네이버)</option>
          <option>비밀번호 변경 요청 (카카오)</option>
          <option>업무 공유 문서 (Google Docs)</option>
          <option>택배 배송 안내 (CJ대한통운)</option>
          <option>국세청 세금 환급 안내</option>
          <option value="__ai__">AI로 직접 생성...</option>
        </select>
      </div>

      <!-- AI 생성 영역 (AI 유형 선택 시 표시) -->
      <div id="ai-gen-wrap" class="hidden flex flex-col gap-3">
        <div class="flex gap-2">
          <input id="ai-description" type="text" placeholder="예: 삼성카드 이상거래 감지 알림, 건강보험공단 환급 안내..." class="flex-1 rounded-xl border border-gray-200 p-2.5 text-sm outline-none focus:border-gray-800" style="background:#FAF9F7;">
          <button id="ai-gen-btn" class="btn-sm btn-dark whitespace-nowrap" onclick="generateAiTemplate()">생성</button>
        </div>
        <div id="ai-preview-wrap" class="hidden">
          <div class="rounded-xl border border-gray-200 overflow-hidden" style="height:220px;">
            <iframe id="ai-preview-frame" style="width:100%;height:100%;border:none;"></iframe>
          </div>
          <p class="text-xs mt-1.5" style="color:#B0ADA9;">제목: <span id="ai-subject-display"></span></p>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-500 mb-2">발송 대상 (<span id="send-target-count">전체</span>)</label>
        <div class="flex flex-col gap-1.5" id="target-list" style="max-height:180px;overflow-y:auto;"></div>
      </div>
      <div id="send-error" class="hidden text-xs px-3 py-2 rounded-xl" style="background:#FEF2F2;color:#DC2626;"></div>
      <div class="flex gap-2 pt-1">
        <button class="btn-sm btn-outline flex-1" onclick="closeSendModal()">취소</button>
        <button class="btn-sm btn-dark flex-1" id="send-btn" onclick="sendPhishing()">메일 발송</button>
      </div>
    </div>
  </div>
</div>

<script>
  const stored = sessionStorage.getItem('user');
  if (!stored) location.href = 'login.html';
  else {
    const u = JSON.parse(stored);
    if (u.role !== 'admin') location.href = 'index.html';
    document.getElementById('admin-name').textContent = u.name || '관리자';
  }
  function logout() { sessionStorage.removeItem('user'); location.href = 'login.html'; }

  let phishingData = [];
  let pfFilter = 'all';

  async function loadPhishing() {
    const { data } = await sb.from('profiles').select('*').neq('role', 'admin');
    if (!data) return;

    phishingData = data.map(r => ({
      name: r.name,
      email: r.email,
      dept: r.dept || '미지정',
      clicked: r.phishing_clicked || false,
      clickedAt: r.phishing_clicked_at || null,
      completion: r.completion || 0,
    }));

    const total      = phishingData.length;
    const clickCount = phishingData.filter(u => u.clicked).length;
    const safeCount  = total - clickCount;
    const clickRate  = total ? Math.round(clickCount / total * 100) : 0;
    const safeRate   = total ? 100 - clickRate : 0;

    document.getElementById('kpi-total').textContent      = total + '명';
    document.getElementById('send-target-count').textContent = '전체 ' + total + '명';
    document.getElementById('kpi-click-rate').textContent = clickRate + '%';
    document.getElementById('kpi-click-sub').textContent  = `${clickCount}명 클릭`;
    document.getElementById('kpi-safe-rate').textContent  = safeRate + '%';
    document.getElementById('kpi-safe-sub').textContent   = `${safeCount}명 미클릭`;
    document.getElementById('kpi-safe-count').textContent = safeCount + '명';

    renderPhishing();
  }

  function renderPhishing() {
    const list = pfFilter === 'all' ? phishingData
      : pfFilter === 'clicked' ? phishingData.filter(u => u.clicked)
      : phishingData.filter(u => !u.clicked);

    if (list.length === 0) {
      document.getElementById('phishing-tbody').innerHTML = `
        <tr><td colspan="5" class="text-center py-10 text-sm" style="color:#B0ADA9;">수강생 데이터가 없습니다.</td></tr>`;
      return;
    }

    document.getElementById('phishing-tbody').innerHTML = list.map(u => `
      <tr class="row-hover" style="border-bottom:1px solid #F5F3F0;">
        <td class="px-5 py-3 font-medium text-gray-900">${u.name}</td>
        <td class="px-4 py-3 text-xs text-gray-500">${u.dept}</td>
        <td class="px-4 py-3">
          <span class="text-xs px-2.5 py-1 rounded-full font-medium ${u.clicked ? 'badge-red' : 'badge-green'}">
            ${u.clicked ? '클릭함' : '안전'}
          </span>
        </td>
        <td class="px-4 py-3 text-xs" style="color:#B0ADA9;">${u.clickedAt ? new Date(u.clickedAt).toLocaleString('ko-KR', {timeZone:'Asia/Seoul'}) : '-'}</td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-2">
            <div class="progress-bar w-16">
              <div class="progress-fill" style="width:${u.completion}%; background:${u.completion===100?'#16A34A':'#1A1A1A'};"></div>
            </div>
            <span class="text-xs text-gray-600">${u.completion}%</span>
          </div>
        </td>
      </tr>`).join('');
  }

  function filterPhishing(f, btn) {
    pfFilter = f;
    document.querySelectorAll('[id^="pf-"]').forEach(b => {
      b.style.background = ''; b.style.color = ''; b.style.borderColor = '';
    });
    btn.style.background = '#1A1A1A'; btn.style.color = 'white'; btn.style.borderColor = '#1A1A1A';
    renderPhishing();
  }

  function showToast(msg) {
    let t = document.getElementById('toast-msg');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast-msg';
      t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#1A1A1A;color:white;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:500;z-index:50;transition:all 0.3s;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1'; t.style.transform = 'translateY(0)';
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(20px)'; }, 2500);
  }

  async function resetPhishing() {
    if (!confirm('피싱 훈련 결과를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
    const { error } = await sb.from('profiles').update({ phishing_clicked: false }).neq('role', 'admin');
    if (error) { alert('초기화 중 오류가 발생했습니다.'); return; }
    showToast('피싱 훈련 결과가 초기화되었습니다');
    await loadPhishing();
  }

  async function loadSessions() {
    const { data } = await sb.from('phishing_sessions').select('*').order('sent_at', { ascending: false });
    const tbody = document.getElementById('sessions-tbody');
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-sm" style="color:#B0ADA9;">아직 진행된 훈련 회차가 없습니다.<br><span class="text-xs">"훈련 메일 발송" 버튼으로 훈련을 시작하세요.</span></td></tr>`;
      return;
    }
    tbody.innerHTML = data.map((s, i) => `
      <tr style="border-bottom:1px solid #F5F3F0;">
        <td class="py-3 text-sm text-gray-700">${data.length - i}회차</td>
        <td class="py-3 text-sm text-gray-600">${s.sent_at ? s.sent_at.slice(0,10) : '-'}</td>
        <td class="py-3 text-sm text-gray-600">${s.email_type}</td>
        <td class="py-3 text-sm text-gray-600">${s.sent_count}명</td>
      </tr>`).join('');
  }

  loadPhishing();
  loadSessions();

  // ── 발송 모달 ──
  let aiTemplate = null;

  function openSendModal() {
    aiTemplate = null;
    document.getElementById('send-error').classList.add('hidden');
    document.getElementById('ai-gen-wrap').classList.add('hidden');
    document.getElementById('ai-preview-wrap').classList.add('hidden');
    document.getElementById('send-email-type').value = '계정 보안 알림 (네이버)';
    document.getElementById('target-list').innerHTML = phishingData.map((u, i) => `
      <label class="flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-gray-50 cursor-pointer">
        <input type="checkbox" checked class="rounded" id="target-${i}" data-email="${u.email}" data-name="${u.name}">
        <span class="text-sm text-gray-700">${u.name}</span>
        <span class="text-xs ml-auto" style="color:#B0ADA9;">${u.dept}</span>
      </label>`).join('');
    document.getElementById('send-modal').classList.remove('hidden');
  }
  function closeSendModal() { document.getElementById('send-modal').classList.add('hidden'); }
  function closeSendOnBackdrop(e) { if (e.target === document.getElementById('send-modal')) closeSendModal(); }

  function onEmailTypeChange() {
    const isAi = document.getElementById('send-email-type').value === '__ai__';
    document.getElementById('ai-gen-wrap').classList.toggle('hidden', !isAi);
    if (!isAi) {
      aiTemplate = null;
      document.getElementById('ai-preview-wrap').classList.add('hidden');
    }
  }

  async function generateAiTemplate() {
    const desc = document.getElementById('ai-description').value.trim();
    if (!desc) return;
    const btn = document.getElementById('ai-gen-btn');
    const errEl = document.getElementById('send-error');
    errEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = '생성 중...';

    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch('/api/generate-phishing-template', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token || ''}` },
        body: JSON.stringify({ description: desc }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '생성 실패');

      aiTemplate = data.template;
      const frame = document.getElementById('ai-preview-frame');
      frame.srcdoc = aiTemplate.html.replace(/\{NAME\}/g, '홍길동').replace(/\{TRACKING_URL\}/g, '#');
      document.getElementById('ai-subject-display').textContent = aiTemplate.subject;
      document.getElementById('ai-preview-wrap').classList.remove('hidden');
    } catch (err) {
      errEl.textContent = '오류: ' + err.message;
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = '생성';
    }
  }

  async function sendPhishing() {
    const btn = document.getElementById('send-btn');
    const errEl = document.getElementById('send-error');
    errEl.classList.add('hidden');

    const emailType = document.getElementById('send-email-type').value;
    const isAi = emailType === '__ai__';

    if (isAi && !aiTemplate) {
      errEl.textContent = '먼저 AI 메일을 생성해주세요.';
      errEl.classList.remove('hidden'); return;
    }

    const targets = phishingData
      .filter((u, i) => document.getElementById(`target-${i}`)?.checked)
      .map(u => ({ email: u.email, name: u.name }));

    if (targets.length === 0) {
      errEl.textContent = '발송 대상을 1명 이상 선택하세요.';
      errEl.classList.remove('hidden'); return;
    }

    btn.disabled = true; btn.textContent = '발송 중...';

    try {
      const { data: { session } } = await sb.auth.getSession();
      const body = isAi
        ? { customTemplate: aiTemplate, targets }
        : { emailType, targets };
      const res = await fetch('/api/send-phishing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token || ''}` },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '발송 실패');

      closeSendModal();
      showToast(`${data.sent}명에게 피싱 훈련 메일을 발송했습니다`);
      await loadSessions();
    } catch (err) {
      errEl.textContent = '오류: ' + err.message;
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = '메일 발송';
    }
  }
</script>
</body>
</html>
